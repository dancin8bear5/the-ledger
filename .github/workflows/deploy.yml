# RENDERED by brain/deploy/render.py (template: pages.yml) — edit there, then re-render.
# Deploy Captain: build → test → deploy → probe → rollback-on-fail → estate report → Claude fix PR.
name: Deploy Captain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-captain-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ESTATE_SUPABASE_URL: ${{ secrets.ESTATE_SUPABASE_URL }}
  ESTATE_SUPABASE_ANON_KEY: ${{ secrets.ESTATE_SUPABASE_ANON_KEY }}
  ESTATE_INGEST_TOKEN: ${{ secrets.ESTATE_INGEST_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node build.mjs
      - name: Test
        run: node tests/settlement.test.mjs
      - name: Stage + stamp site
        run: |
          mkdir -p "$RUNNER_TEMP/_site"
          git ls-files -z | grep -zvE '^(\.github/|tests/|supabase/)' | xargs -0 cp --parents -t "$RUNNER_TEMP/_site"
          cp ./index.html "$RUNNER_TEMP/_site/index.html"
          sed -i "0,/<head>/s//<head><meta name=\"build\" content=\"${GITHUB_SHA}\">/" "$RUNNER_TEMP/_site/index.html"
          grep -q "content=\"${GITHUB_SHA}\"" "$RUNNER_TEMP/_site/index.html"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  probe:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe live build id
        run: |
          ok=
          for i in $(seq 1 20); do
            if curl -fsSL -m 20 "https://dancin8bear5.github.io/the-ledger/?probe=${GITHUB_SHA}-$i" | grep -q "content=\"${GITHUB_SHA}\""; then ok=1; break; fi
            sleep 15
          done
          if [ -n "$ok" ]; then
            bash .github/estate-report.sh probe ok "live at https://dancin8bear5.github.io/the-ledger/ serves ${GITHUB_SHA:0:7}"
          else
            bash .github/estate-report.sh probe error "https://dancin8bear5.github.io/the-ledger/ is not serving ${GITHUB_SHA:0:7} after 5 min"
            exit 1
          fi
      - name: Mark last green
        run: git push -f origin "HEAD:refs/tags/deploy-last-green"

  rollback:
    # Build failures never reach deploy, so nothing to roll back; deploy or probe failure does.
    if: failure() && needs.deploy.result != 'skipped' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [deploy, probe]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-last-green
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node build.mjs
      - name: Test
        run: node tests/settlement.test.mjs
      - name: Stage + stamp site
        run: |
          mkdir -p "$RUNNER_TEMP/_site"
          git ls-files -z | grep -zvE '^(\.github/|tests/|supabase/)' | xargs -0 cp --parents -t "$RUNNER_TEMP/_site"
          cp ./index.html "$RUNNER_TEMP/_site/index.html"
          sed -i "0,/<head>/s//<head><meta name=\"build\" content=\"$(git rev-parse HEAD)\">/" "$RUNNER_TEMP/_site/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-rollback
          path: ${{ runner.temp }}/_site
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-rollback
      - name: Report rollback
        if: always()
        run: "bash .github/estate-report.sh action \"${{ job.status == 'success' && 'warn' || 'error' }}\" \"rolled back to deploy-last-green $(git rev-parse --short HEAD): ${{ job.status }}\""

  report:
    if: always()
    needs: [build, deploy, probe, rollback]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Report run to estate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/verdict"
          import json, os
          n = json.loads(os.environ["NEEDS"])
          failed = [k for k, v in n.items() if v["result"] == "failure"]
          ran = [k for k, v in n.items() if v["result"] == "success"]
          if not failed:
              print("ok\tgreen: " + ", ".join(ran))
          elif n.get("rollback", {}).get("result") == "success":
              print("error\tfailed at %s — rolled back to last green" % ", ".join(failed))
          else:
              print("error\tfailed at " + ", ".join(failed))
          PY
          IFS=$'\t' read -r status summary < "$RUNNER_TEMP/verdict"
          bash .github/estate-report.sh run "$status" "[$GITHUB_EVENT_NAME $GITHUB_REF_NAME] $summary" "$NEEDS"

  claude-fix:
    # Main-branch failures only. claude-code-action can't run on a `push` event
    # ("Unsupported event type: push"), so this job hands off to claude-fix.yml via
    # workflow_dispatch, which it supports. GITHUB_TOKEN may trigger workflow_dispatch.
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [report]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Hand off to Claude (claude-fix.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run claude-fix.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f run_id="$GITHUB_RUN_ID" -f sha="$GITHUB_SHA" -f workflow="$GITHUB_WORKFLOW"
          echo "::notice::Claude fix dispatched for run $GITHUB_RUN_ID"
