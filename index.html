function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---------- adjustment modal (cash handoff / shared expense) ----------
function openAdjModal(adj, startKind, opts = {}) {
  const editing = !!adj;
  const kind = adj ? adj.kind : (startKind || 'expense');
  let scope = adj ? (adj.scope || null) : (opts.scope || null); // cash only: which settlement it counts toward
  let amount = adj ? (adj.amount || 0) : 0;
  let note = adj ? (adj.note || '') : '';
  let payerId = null;
  let recvId = null;
  let sharers = new Set(state.players.map((p) => p.id)); // expense default: everyone
  if (adj) {
    const pos = (adj.lines || []).find((l) => l.delta > 0);
    payerId = pos ? pos.player_id : null;
    if (kind === 'cash') {
      const neg = (adj.lines || []).find((l) => l.delta < 0);
      recvId = neg ? neg.player_id : null;
    } else {
      sharers = new Set((adj.lines || []).filter((l) => l.delta < 0).map((l) => l.player_id));
      if (payerId) sharers.add(payerId);
    }
  }

  const isDirty = () => amount > 0 || !!payerId || !!note.trim();
  const bg = el('div', { class: 'modal-bg', onclick: (e) => {
    if (e.target !== bg) return;
    if (!isDirty() || confirm('Discard this entry? Your input will be lost.')) bg.remove();
  } });
  const modal = el('div', { class: 'modal' });
  bg.append(modal);
  document.body.append(bg);

  function rebuild() { modal.innerHTML = ''; build(); }

  const preview = el('div', { class: 'muted', style: 'margin-top:8px' });
  function updatePreview() {
    if (kind !== 'expense') return;
    const n = sharers.size;
    const payer = state.players.find((p) => p.id === payerId);
    if (!amount || n < 2) { preview.textContent = 'Split evenly among everyone checked; odd dollars are eaten by whoever fronted it.'; return; }
    const each = Math.floor(amount / n);
    const extra = amount - each * n;
    preview.textContent = money(amount) + ' ÷ ' + n + ' = ' + money(each) + ' each'
      + (payer ? ' — everyone else owes ' + payer.name + ' ' + money(each) : '')
      + (extra ? ' (' + (payer ? payer.name : 'payer') + ' eats the extra ' + money(extra) + ')' : '') + '.';
  }

  function pickList(title, isSel, onPick) {
    modal.append(el('div', { class: 'section-h', text: title }));
    for (const p of state.players) {
      const sel = isSel(p.id);
      modal.append(el('div', { class: 'check' + (sel ? ' sel' : ''), onclick: () => onPick(p.id) }, [
        el('div', { class: 'box' }),
        el('div', { class: 'grow title', text: p.name }),
      ]));
    }
  }

  function build() {
    modal.append(el('div', { class: 'bar' }, [
      el('button', { class: 'btn ghost small', text: 'Cancel', onclick: () => bg.remove() }),
      el('div', { class: 'grow', style: 'text-align:center' }, [el('h2', { text: (editing ? 'Edit ' : '') + (kind === 'expense' ? (editing ? 'expense' : 'Shared expense') : (editing ? 'payment' : 'Cash payment')) })]),
      el('button', { class: 'btn small', text: 'Save', onclick: onSave }),
    ]));

    if (kind === 'cash') {
      const seg = el('div', { class: 'inline', style: 'margin-top:6px;gap:6px' });
      for (const k of [null, 'games', 'expenses']) {
        seg.append(el('button', { class: 'btn small ' + (scope === k ? '' : 'ghost'), style: 'flex:1',
          text: SCOPE_LABEL[k || 'all'], onclick: () => { scope = k; rebuild(); } }));
      }
      modal.append(el('label', { class: 'field', text: 'Counts toward' }), seg);
    }

    if (kind === 'expense') {
      const chips = el('div', { class: 'inline', style: 'margin-top:12px;flex-wrap:wrap;gap:6px' });
      for (const [icon, label] of [['🛒', 'Groceries'], ['⛽', 'Gas'], ['🍕', 'Food'], ['🍺', 'Drinks'], ['🏠', 'Lodging'], ['🎟', 'Tickets']]) {
        chips.append(el('button', { class: 'btn small ' + (note === label ? '' : 'ghost'), text: icon + ' ' + label,
          onclick: () => { note = label; rebuild(); } }));
      }
      modal.append(el('div', { class: 'section-h', text: 'What was it?' }), chips);
    }

    const ctl = moneyControl(amount, (v) => { amount = v; updatePreview(); });
    modal.append(el('label', { class: 'field', text: 'Amount' }),
      el('div', { class: 'inline', style: 'margin-top:6px;flex-wrap:wrap' }, [
        el('div', { class: 'grow muted', style: 'flex:1', text: 'Slide or type (cents round to the nearest $)' }),
        ctl.num,
        ctl.range,
      ]));

    if (kind === 'cash') {
      pickList('Who paid (hands over the cash)', (id) => payerId === id, (id) => { payerId = id; if (recvId === id) recvId = null; rebuild(); });
      pickList('Who received it', (id) => recvId === id, (id) => { recvId = id; if (payerId === id) payerId = null; rebuild(); });
      modal.append(el('div', { class: 'muted', style: 'margin-top:8px', text: 'Money that changed hands (paying someone back, or a loan) — it moves both balances toward settled.' }));
    } else {
      pickList('Who fronted the money', (id) => payerId === id, (id) => { payerId = id; sharers.add(id); rebuild(); });
      pickList('Who splits it (tap to toggle)', (id) => sharers.has(id), (id) => {
        if (sharers.has(id) && id !== payerId) sharers.delete(id); else sharers.add(id);
        rebuild();
      });
      modal.append(preview);
      updatePreview();
    }

    const noteInp = el('input', { class: 'inp', value: note, placeholder: kind === 'expense' ? 'e.g. Jewel-Osco run' : 'Note (optional)', oninput: (e) => (note = e.target.value) });
    modal.append(el('label', { class: 'field', text: 'Note (optional)' }), noteInp);

    if (editing) {
      modal.append(el('button', { class: 'btn ghost block', style: 'margin-top:18px;color:var(--neg)', text: kind === 'expense' ? 'Delete expense' : 'Delete payment',
        onclick: () => { if (confirm(kind === 'expense' ? 'Delete this expense?' : 'Delete this payment?')) { deleteAdjustment(adj.id); bg.remove(); } } }));
    }
  }

  function onSave() {
    if (amount <= 0) { toast('Enter an amount'); return; }
    if (!payerId) { toast('Pick who paid'); return; }
    let lines;
    if (kind === 'cash') {
      if (!recvId) { toast('Pick who received it'); return; }
      lines = [
        { player_id: payerId, delta: amount },
        { player_id: recvId, delta: -amount },
      ];
    } else {
      const others = [...sharers].filter((id) => id !== payerId);
      if (!others.length) { toast('Pick at least one other person to split with'); return; }
      const n = sharers.has(payerId) ? others.length + 1 : others.length;
      const base = Math.floor(amount / n);
      lines = others.map((id) => ({ player_id: id, delta: -base }));
      lines.push({ player_id: payerId, delta: base * others.length });
    }
    saveAdjustment({ id: adj ? adj.id : null, kind, note: note.trim(), amount, lines, scope });
    bg.remove();
  }

  build();
}

// ---------- game modal ----------
function openGameModal(game) {
  const editing = !!game;
  let name = game ? game.name : '';
  // Dropdown selection: a preset name, '' (none yet), or '__other__' (custom text).
  let nameChoice = game ? (isKnownGame(game.name) ? game.name : '__other__') : '';
  // Default stake for newly selected players: last edited amount in this game,
  // seeded from the most recent game's buy-in (buy-ins often repeat).
  let stake = game ? game.buyin : (state.games.length ? state.games[0].buyin : 0);
  let when = game ? new Date(game.played_at) : new Date();
  const selected = new Set(game ? game.lines.map((l) => l.player_id) : []);
  const contribs = {}; // player_id -> total contribution (buy-in + rebuys)
  const payouts = {};  // player_id -> payout
  let winnerId = null;
  // 'winner' = winner takes all · 'split' = edit payouts · 'chips' = cash game by chip count
  let mode = 'winner';
  let modeTouched = editing;
  const chips = {}; // player_id -> ending chip count (null = not counted yet)
  const rebuys = {}; // player_id -> number of rebuys (already included in contribs)
  const lastChip = state.games.find((g) => g.mode === 'chips' && g.chip_dollars && g.chip_count);
  let chipDollars = (game && game.chip_dollars) || (lastChip ? lastChip.chip_dollars : 20);
  let chipCount = (game && game.chip_count) || (lastChip ? lastChip.chip_count : 20);
  if (game) {
    for (const l of game.lines) {
      payouts[l.player_id] = l.payout; contribs[l.player_id] = l.contribution;
      if (l.chips != null) chips[l.player_id] = l.chips;
      if (l.rebuys) rebuys[l.player_id] = l.rebuys;
    }
    const winners = game.lines.filter((l) => l.payout > 0);
    winnerId = winners.length === 1 ? winners[0].player_id : null;
    mode = game.mode || (winners.length > 1 ? 'split' : 'winner'); // older games: infer from payouts
  }
  // A new game defaults to how this game was last scored on the trip, else chips for poker.
  function defaultModeFor(n) {
    const prev = state.games.find((g) => g.name === n && g.mode);
    return prev ? prev.mode : (CHIP_GAME_RE.test(n) ? 'chips' : 'winner');
  }
  const isSplit = () => mode === 'split';

  // Clicking outside the sheet must never silently discard entries: if anything
  // has been entered, ask first; an untouched modal just closes.
  const isDirty = () => !!name.trim() || selected.size > 0;
  const bg = el('div', { class: 'modal-bg', onclick: (e) => {
    if (e.target !== bg) return;
    if (!isDirty() || confirm('Discard this game? Your entries will be lost.')) bg.remove();
  } });
  const modal = el('div', { class: 'modal' });
  bg.append(modal);
  document.body.append(bg);

  // Payout preset state: while pendingPcts is set, tapping payout rows assigns
  // finishing places and fills amounts from presetSplit().
  let pendingPcts = null;
  let presetLabel = null;
  let placeOrder = [];

  const contribOf = (id) => (contribs[id] != null ? contribs[id] : stake);
  // Set a player's buy-in; the last edited amount becomes the default for newly
  // selected players. The money control manages its own display, so no rebuild.
  function setAmt(pid, v) {
    contribs[pid] = Math.max(0, Math.round(v || 0));
    if (!rebuys[pid]) stake = contribs[pid]; // a rebuyer's running total isn't the game's buy-in
    updateTotals();
  }
  // One rebuy = one more buy-in: the chip rate's dollars in a cash game, else the game's buy-in.
  const rebuyAmt = () => (mode === 'chips' ? chipDollars : stake);
  function addRebuy(p) {
    const amt = rebuyAmt();
    if (!(amt > 0)) { toast('Set the buy-in amount first'); return; }
    contribs[p.id] = contribOf(p.id) + amt;
    rebuys[p.id] = (rebuys[p.id] || 0) + 1;
    rebuild();
    toast(p.name + ' rebought — now in for ' + money(contribs[p.id]));
  }
  function undoRebuy(p) {
    if (!rebuys[p.id]) return;
    contribs[p.id] = Math.max(0, contribOf(p.id) - rebuyAmt());
    rebuys[p.id] -= 1;
    if (!rebuys[p.id]) delete rebuys[p.id];
    rebuild();
    toast('Removed a rebuy — ' + p.name + ' now in for ' + money(contribs[p.id]));
  }
  const selPlayers = () => state.players.filter((p) => selected.has(p.id));
  const pot = () => selPlayers().reduce((s, p) => s + contribOf(p.id), 0);
  const totalPayout = () => selPlayers().reduce((s, p) => s + (payouts[p.id] || 0), 0);

  function seedManual() {
    for (const p of selPlayers()) if (payouts[p.id] == null) payouts[p.id] = p.id === winnerId ? pot() : 0;
  }
  function rebuild() { modal.innerHTML = ''; build(); }

  // ---- chip-count (cash game) math ----
  const perChip = () => chipDollars / chipCount;
  const chipsSold = () => (pot() * chipCount) / chipDollars;
  const chipsCounted = () => selPlayers().reduce((s, p) => s + (chips[p.id] || 0), 0);
  const anyCounted = () => selPlayers().some((p) => chips[p.id] != null);
  // Exact integer comparison: counted chips are worth exactly the pot.
  const chipsBalanced = () => anyCounted() && pot() > 0 && chipsCounted() * chipDollars === pot() * chipCount;
  const chipPayoutMap = () => chipPayouts(selPlayers().map((p) => ({ id: p.id, chips: chips[p.id] || 0 })), chipDollars, chipCount);

  const isInProgress = () => (mode === 'chips' ? !chipsBalanced() : isSplit() ? totalPayout() === 0 : !winnerId);

  function build() {
    // top bar
    modal.append(el('div', { class: 'bar' }, [
      el('button', { class: 'btn ghost small', text: 'Cancel', onclick: () => bg.remove() }),
      el('div', { class: 'grow', style: 'text-align:center' }, [el('h2', { text: editing ? 'Edit game' : 'New game' })]),
      el('button', { class: 'btn small savebtn', text: saveLabel(), onclick: onSave }),
    ]));

    // fields — game name: dropdown of common games + a custom "Other…" option
    const nameSel = el('select', { class: 'inp' });
    nameSel.append(el('option', { value: '', text: 'Select a game…' }));
    for (const g of allGameNames()) nameSel.append(el('option', { value: g, text: g }));
    nameSel.append(el('option', { value: '__other__', text: 'Other (type a name)…' }));
    nameSel.value = nameChoice;
    nameSel.addEventListener('change', (e) => {
      nameChoice = e.target.value;
      name = nameChoice === '__other__' ? (isKnownGame(name) ? '' : name) : nameChoice;
      if (!modeTouched && name) { mode = defaultModeFor(name); if (isSplit()) seedManual(); }
      rebuild();
    });
    modal.append(el('label', { class: 'field', text: 'Game' }), nameSel);
    if (nameChoice === '__other__') {
      const customInp = el('input', { class: 'inp', style: 'margin-top:8px', value: isKnownGame(name) ? '' : name,
        placeholder: 'Game name', oninput: (e) => (name = e.target.value) });
      modal.append(customInp);
    }

    const dt = el('input', { class: 'inp', type: 'datetime-local', value: toLocalInput(when),
      oninput: (e) => { const d = new Date(e.target.value); if (!isNaN(d)) when = d; } });
    modal.append(el('label', { class: 'field', text: 'Time' }), dt);

    // how the game is scored
    modal.append(el('label', { class: 'field', text: 'How is it scored?' }));
    const seg = el('div', { class: 'inline', style: 'margin-top:6px;gap:6px' });
    for (const [k, label] of [['winner', '👑 Winner takes all'], ['split', '➗ Split pot'], ['chips', '🪙 Chip count']]) {
      seg.append(el('button', { class: 'btn small ' + (mode === k ? '' : 'ghost'), style: 'flex:1;padding:8px 4px', text: label,
        onclick: () => { mode = k; modeTouched = true; if (isSplit()) seedManual(); rebuild(); } }));
    }
    modal.append(seg);

    if (mode === 'chips') {
      const numStyle = 'width:72px;flex:none;text-align:center;margin-top:0;padding:8px 4px';
      const dIn = el('input', { class: 'inp chipdollars', type: 'number', min: '1', step: '1', inputmode: 'numeric', value: String(chipDollars), style: numStyle,
        oninput: (e) => { const v = Math.round(parseFloat(e.target.value)); if (v > 0) { chipDollars = v; updateTotals(); } } });
      const cIn = el('input', { class: 'inp chipcount', type: 'number', min: '1', step: '1', inputmode: 'numeric', value: String(chipCount), style: numStyle,
        oninput: (e) => { const v = Math.round(parseFloat(e.target.value)); if (v > 0) { chipCount = v; updateTotals(); } } });
      modal.append(el('div', { class: 'card', style: 'margin-top:10px;padding:10px 12px' }, [
        el('div', { style: 'font-weight:700', text: 'Chip rate — set before anyone buys in' }),
        el('div', { class: 'inline', style: 'margin-top:8px;gap:8px;align-items:center' }, [
          el('span', { text: '$' }), dIn, el('span', { text: 'buys' }), cIn, el('span', { text: 'chips' }),
        ]),
        el('div', { class: 'muted perchip', style: 'margin-top:6px', text: '= ' + cents(perChip()) + ' per chip' }),
      ]));
    }

    // participants — each selected player carries their own buy-in amount
    modal.append(el('div', { class: 'section-h potline', text: 'Who played · pot ' + money(pot()) }));
    for (const p of state.players) {
      const sel = selected.has(p.id);
      const toggle = () => {
        if (selected.has(p.id)) { selected.delete(p.id); delete payouts[p.id]; delete contribs[p.id]; delete chips[p.id]; delete rebuys[p.id]; if (winnerId === p.id) winnerId = null; }
        else { selected.add(p.id); contribs[p.id] = mode === 'chips' ? chipDollars : stake; } // chips: one buy-in; else last-used amount
        if (isSplit()) seedManual();
        rebuild();
      };
      const row = el('div', { class: 'check' + (sel ? ' sel' : '') }, [
        el('div', { class: 'box', onclick: toggle }),
        el('div', { class: 'grow title', text: p.name, style: 'cursor:pointer', onclick: toggle }),
      ]);
      if (sel) {
        row.style.flexWrap = 'wrap';
        const ctl = moneyControl(contribOf(p.id), (v) => setAmt(p.id, v), 'buyamt', p.id);
        row.append(ctl.num, ctl.range);
        const n = rebuys[p.id] || 0;
        const info = [];
        if (n) info.push('🔁 ' + n + ' rebuy' + (n === 1 ? '' : 's'));
        if (mode === 'chips') info.push(fmtChips((contribOf(p.id) * chipCount) / chipDollars) + ' chips bought');
        row.append(el('div', { class: 'inline', style: 'width:100%;margin-top:6px;gap:8px' }, [
          el('div', { class: 'grow muted rebuyinfo', style: 'flex:1', 'data-bpid': p.id, text: info.join(' · ') }),
          n ? el('button', { class: 'btn ghost small undorebuy', title: 'Undo one rebuy', text: '− Undo', onclick: (e) => { e.stopPropagation(); undoRebuy(p); } }) : null,
          el('button', { class: 'btn ghost small rebuybtn', text: '＋ Rebuy ' + money(rebuyAmt()), onclick: (e) => { e.stopPropagation(); addRebuy(p); } }),
        ]));
      }
      modal.append(row);
    }
    if (selected.size) modal.append(el('div', { class: 'muted', style: 'margin-top:6px', text:
      'The amount is each player\'s TOTAL in. Tap ＋ Rebuy each time someone buys back in (− Undo fixes a mis-tap), or type a total.' }));
    // Inline add-player (so you can build the roster right here if nobody's added yet)
    const addBuf = { v: '' };
    const doAddPlayer = async () => {
      const nm = addBuf.v.trim(); if (!nm) return;
      const p = await addPlayerReturning(nm);
      if (p) {
        if (!state.players.some((x) => x.id === p.id)) state.players.push(p);
        state.players.sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
        selected.add(p.id);
        if (mode === 'chips') contribs[p.id] = chipDollars; // otherwise unset = follows the last-typed buy-in
        if (isSplit()) seedManual();
        rebuild();
      }
    };
    const addInp = el('input', { class: 'inp', placeholder: state.players.length ? 'Add another player…' : 'Add a player…',
      oninput: (e) => (addBuf.v = e.target.value) });
    addInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') doAddPlayer(); });
    modal.append(el('div', { class: 'inline', style: 'margin-top:8px' }, [
      el('div', { class: 'grow', style: 'flex:1' }, [addInp]),
      el('button', { class: 'btn ghost small', text: 'Add', onclick: doAddPlayer }),
    ]));

    if (selected.size >= 2) {
      if (mode === 'chips') {
        modal.append(el('div', { class: 'section-h', text: 'Ending chip counts' }));
        for (const p of selPlayers()) {
          const inp = el('input', { class: 'inp chipin', type: 'number', min: '0', step: '1', inputmode: 'numeric', 'data-cid': p.id,
            value: chips[p.id] != null ? String(chips[p.id]) : '', placeholder: 'chips',
            style: 'width:90px;flex:none;text-align:center;margin-top:0;padding:8px 4px',
            oninput: (e) => {
              const raw = e.target.value.trim();
              if (raw === '') delete chips[p.id];
              else chips[p.id] = Math.max(0, Math.round(parseFloat(raw) || 0));
              updateTotals();
            } });
          modal.append(el('div', { class: 'check', style: 'flex-wrap:wrap' }, [
            el('div', { class: 'grow' }, [
              el('div', { class: 'title', text: p.name }),
              el('div', { class: 'muted', 'data-cpid': p.id }),
            ]),
            inp,
          ]));
        }
        modal.append(el('div', { class: 'chipbal', style: 'margin-top:10px' }));
        modal.append(el('div', { class: 'muted chiproundnote', style: 'margin-top:6px' }));
      } else if (!isSplit()) {
        modal.append(el('div', { class: 'section-h', text: 'Winner — takes the whole pot' }));
        for (const p of selPlayers()) {
          const isW = winnerId === p.id;
          let netEl;
          if (winnerId) {
            const net = isW ? pot() - contribOf(p.id) : -contribOf(p.id);
            netEl = el('div', { class: net > 0 ? 'pos' : net < 0 ? 'neg' : 'zero', 'data-npid': p.id, text: signed(net) });
          } else {
            netEl = el('div', { class: 'muted', 'data-npid': p.id, text: 'in for ' + money(contribOf(p.id)) });
          }
          modal.append(el('div', { class: 'check' + (isW ? ' sel' : ''), onclick: () => { winnerId = isW ? null : p.id; rebuild(); } }, [
            el('div', { class: 'grow' }, [ el('span', { class: isW ? 'crown' : '', text: (isW ? '👑 ' : '') + p.name }) ]),
            netEl,
          ]));
        }
        if (!winnerId) modal.append(el('div', { class: 'muted', style: 'margin-top:6px', text: "No winner yet? Just tap Save — the game stays open and won't affect Settle Up until you set the result." }));
      } else {
        modal.append(el('div', { class: 'section-h', text: 'Payouts' }));

        // Preset chips: one-tap payout structures
        const chipRow = el('div', { class: 'inline', style: 'flex-wrap:wrap;gap:6px;margin-top:4px' });
        const PRESETS = [['70/30', [70, 30]], ['70/20/10', [70, 20, 10]], ['50/50 chop', [50, 50]], ['Custom %', null]];
        for (const [label, pcts] of PRESETS) {
          const active = presetLabel === label;
          chipRow.append(el('button', { class: 'btn small ' + (active ? '' : 'ghost'), text: label, onclick: () => {
            if (active) { pendingPcts = null; presetLabel = null; placeOrder = []; rebuild(); return; }
            let chosen = pcts;
            if (!chosen) {
              const raw = prompt('Percentages, comma-separated (must sum to 100):', '60,30,10');
              if (!raw) return;
              chosen = raw.split(',').map((s) => parseInt(s.trim(), 10));
              if (chosen.some(isNaN) || chosen.reduce((a, b) => a + b, 0) !== 100) { toast('Percentages must sum to 100'); return; }
            }
            if (chosen.length > selected.size) { toast('More places than players'); return; }
            pendingPcts = chosen; presetLabel = label; placeOrder = [];
            for (const p of selPlayers()) payouts[p.id] = 0;
            rebuild();
          } }));
        }
        modal.append(chipRow);
        if (pendingPcts) {
          modal.append(el('div', { class: 'muted', style: 'margin-top:6px', text: 'Tap players below in finishing order (' + pendingPcts.join('/') + '). Odd dollars go to 1st.' }));
        }

        const ord = (n) => n + (['st', 'nd', 'rd'][n - 1] || 'th');
        for (const p of selPlayers()) {
          const placeIdx = placeOrder.indexOf(p.id);
          const ctl = moneyControl(payouts[p.id] || 0, (v) => { payouts[p.id] = v; updateTotals(); }, 'payin', p.id);
          modal.append(el('div', { class: 'check' + (placeIdx >= 0 ? ' sel' : ''), style: 'flex-wrap:wrap', onclick: (e) => {
            if (e.target.tagName === 'INPUT' || !pendingPcts || placeOrder.includes(p.id)) return;
            placeOrder.push(p.id);
            const shares = presetSplit(pot(), pendingPcts);
            payouts[p.id] = shares[placeOrder.length - 1];
            if (placeOrder.length === pendingPcts.length) { pendingPcts = null; presetLabel = null; }
            rebuild();
          } }, [
            placeIdx >= 0 ? el('span', { class: 'pos', style: 'font-weight:800;min-width:34px', text: ord(placeIdx + 1) }) : null,
            el('div', { class: 'grow title', text: p.name }),
            ctl.num,
            ctl.range,
          ]));
        }
        modal.append(el('div', { class: 'balanceline', style: 'margin-top:10px' }, [balanceLabel()]));
      }
    } else {
      modal.append(el('div', { class: 'muted', style: 'margin-top:12px', text: 'Select at least 2 players.' }));
    }

    if (editing) {
      modal.append(el('button', { class: 'btn ghost block', style: 'margin-top:18px;color:var(--neg)', text: 'Delete game',
        onclick: () => { if (confirm('Delete this game?')) { deleteGame(game.id); bg.remove(); } } }));
    }
    updateTotals();
  }

  const saveLabel = () => (selected.size >= 2 && isInProgress() ? 'Save (open)' : 'Save');

  function updateChips() {
    const pc = $('.perchip', modal); if (pc) pc.textContent = '= ' + cents(perChip()) + ' per chip';
    const balanced = chipsBalanced();
    const settled = balanced ? chipPayoutMap() : null;
    let rounded = false;
    modal.querySelectorAll('[data-cpid]').forEach((n) => {
      const pid = n.dataset.cpid;
      const inFor = contribOf(pid);
      if (chips[pid] == null) { n.className = 'muted'; n.textContent = 'in for ' + money(inFor) + ' · not counted yet'; return; }
      const worth = chips[pid] * perChip();
      const net = worth - inFor;
      let txt = 'worth ' + cents(worth) + ' · in for ' + money(inFor) + ' · ' + signedCents(net);
      if (settled && settled[pid] !== worth) { rounded = true; txt += ' (settles ' + signed(settled[pid] - inFor) + ')'; }
      n.className = net > 0.004 ? 'pos' : net < -0.004 ? 'neg' : 'zero';
      n.textContent = txt;
    });
    const bal = $('.chipbal', modal);
    if (bal) {
      bal.innerHTML = '';
      const sold = chipsSold(), counted = chipsCounted(), diff = counted - sold;
      if (!anyCounted()) {
        bal.append(el('span', { class: 'muted', text: fmtChips(sold) + ' chips in play (' + money(pot()) + '). Enter each stack at cash-out — busted players are 0 or blank.' }));
      } else if (balanced) {
        bal.append(el('span', { class: 'balance-ok', text: '✓ All ' + fmtChips(sold) + ' chips accounted for — ready to save' }));
      } else {
        bal.append(el('span', { class: 'balance-off', text: '⚠︎ Counted ' + fmtChips(counted) + ' of ' + fmtChips(sold) + ' chips — '
          + fmtChips(Math.abs(diff)) + (diff < 0 ? ' short' : ' over') + ' (' + cents(Math.abs(diff) * perChip()) + '). Recount before finishing.' }));
      }
    }
    const note = $('.chiproundnote', modal);
    if (note) note.textContent = rounded ? 'Settle Up works in whole dollars — cents are rounded so the pot still balances exactly.' : '';
  }

  function balanceLabel() {
    const d = totalPayout() - pot();
    return d === 0
      ? el('span', { class: 'balance-ok', text: '✓ Pot balanced' })
      : el('span', { class: 'balance-off', text: '⚠︎ Off by ' + money(Math.abs(d)) + (d > 0 ? ' over' : ' under') });
  }
  function updateTotals() {
    const potline = $('.potline', modal); if (potline) potline.textContent = 'Who played · pot ' + money(pot());
    const bl = $('.balanceline', modal); if (bl) { bl.innerHTML = ''; bl.append(balanceLabel()); }
    const sb = $('.savebtn', modal); if (sb) sb.textContent = saveLabel();
    modal.querySelectorAll('.rebuybtn').forEach((b) => (b.textContent = '＋ Rebuy ' + money(rebuyAmt())));
    modal.querySelectorAll('[data-bpid]').forEach((el2) => {
      const pid = el2.dataset.bpid, n = rebuys[pid] || 0, info = [];
      if (n) info.push('🔁 ' + n + ' rebuy' + (n === 1 ? '' : 's'));
      if (mode === 'chips') info.push(fmtChips((contribOf(pid) * chipCount) / chipDollars) + ' chips bought');
      el2.textContent = info.join(' · ');
    });
    if (mode === 'chips') updateChips();
    // Winner-screen net / "in for" labels (buy-in amounts are inputs and manage themselves)
    modal.querySelectorAll('[data-npid]').forEach((n) => {
      const pid = n.dataset.npid;
      if (winnerId) {
        const net = pid === winnerId ? pot() - contribOf(pid) : -contribOf(pid);
        n.className = net > 0 ? 'pos' : net < 0 ? 'neg' : 'zero';
        n.textContent = signed(net);
      } else {
        n.className = 'muted';
        n.textContent = 'in for ' + money(contribOf(pid));
      }
    });
  }

  function onSave() {
    if (!name.trim()) { toast('Pick or name the game'); return; }
    if (selected.size < 2) { toast('Pick at least 2 players'); return; }
    let lines;
    if (mode === 'chips') {
      if (pot() <= 0) { toast('Enter buy-ins first'); return; }
      const chipOf = (id) => (chips[id] != null ? chips[id] : null);
      if (chipsBalanced()) {
        const pay = chipPayoutMap();
        lines = selPlayers().map((p) => ({ player_id: p.id, contribution: contribOf(p.id), payout: pay[p.id] || 0, chips: chips[p.id] || 0 }));
      } else {
        if (anyCounted()) {
          const diff = chipsCounted() - chipsSold();
          const ok = confirm('Chip counts don\'t balance — ' + fmtChips(Math.abs(diff)) + ' chips ' + (diff < 0 ? 'short' : 'over')
            + ' (' + cents(Math.abs(diff) * perChip()) + ').\n\nSave as IN PROGRESS? It won\'t count toward Settle Up until the counts balance.');
          if (!ok) return;
        }
        lines = selPlayers().map((p) => ({ player_id: p.id, contribution: contribOf(p.id), payout: 0, chips: chipOf(p.id) }));
      }
    } else if (isSplit()) {
      const tp = totalPayout();
      if (tp > 0 && tp !== pot()) { toast('Payouts must equal the pot, or clear them to save in progress'); return; }
      // tp === 0 => saved in progress; tp === pot => finalized split
      lines = selPlayers().map((p) => ({ player_id: p.id, contribution: contribOf(p.id), payout: payouts[p.id] || 0 }));
    } else {
      // Winner set => winner-takes-all; no winner => open game (no payouts yet)
      lines = selPlayers().map((p) => ({ player_id: p.id, contribution: contribOf(p.id), payout: (winnerId && p.id === winnerId) ? pot() : 0 }));
    }
    lines = lines.map((l) => ({ ...l, rebuys: rebuys[l.player_id] || 0 }));
    const isChips = mode === 'chips';
    saveGame({ id: game ? game.id : null, name: name.trim(), buyin: isChips ? chipDollars : stake, played_at: when.toISOString(), lines,
      mode, chip_dollars: isChips ? chipDollars : null, chip_count: isChips ? chipCount : null });
    bg.remove();
  }

  build();
}

function toLocalInput(d) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

// ---------- boot ----------
render();
loadCustomGames();
loadAll();
if (state.tripId) subscribeRealtime(state.tripId);

// ---------- self-heal watchdog ----------
// Coming back online or returning to the tab always re-syncs; a slow heartbeat
// (visible tab only) catches anything realtime missed. Data volume is tiny, so
// a periodic refetch is cheap insurance.
window.addEventListener('online', () => {
  if (state.tripId) { scheduleRefetch(); subscribeRealtime(state.tripId); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (needsRefetch || state.tripId)) {
    needsRefetch = false;
    scheduleRefetch();
  }
});
setInterval(() => {
  if (document.visibilityState === 'visible' && state.tripId) scheduleRefetch();
}, 45000);
// Unhandled async failures degrade to "reconnecting" + refetch, never a dead UI.
window.addEventListener('unhandledrejection', (e) => {
  console.warn('unhandled rejection', e.reason);
  setConn(false);
  if (state.tripId) scheduleRefetch();
});

// Offline shell + faster repeat loads. Skipped on localhost so tests and dev
// never fight a cached copy.
if ('serviceWorker' in navigator && !/^(localhost|127\.)/.test(location.hostname)) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// Ops/debug handle (also used by the test suite).
window.__ledgerDebug = { state, render, loadAll, setConn, scheduleRefetch };
</script>
</body>
