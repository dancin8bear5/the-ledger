// The Ledger — settlement engine.
//
// Pure functions, no dependencies. This is the single source of truth for the
// who-owes-whom math; it is imported by the Node tests and inlined into
// index.html at build time. All money is whole-dollar integers.

// Net balance per player across a set of game lines.
// lines: [{ name, contribution, payout }]
// Returns { [name]: net } where net = sum(payout - contribution).
// Positive = the player is owed money; negative = the player owes.
function netBalances(lines) {
  const balances = {};
  for (const l of lines) {
    balances[l.name] = (balances[l.name] ?? 0) + (l.payout - l.contribution);
  }
  return balances;
}

// Minimize the number of payments that settle everyone.
// Greedy max-creditor / max-debtor: repeatedly match the person owed the most
// with the person who owes the most, settling the smaller amount each time.
// Produces at most (n - 1) payments. Deterministic (ties broken by name).
// Returns [{ from, to, amount }] (from pays to).
function minimize(balances) {
  const cmp = (a, b) =>
    a.amount !== b.amount ? b.amount - a.amount : a.name < b.name ? -1 : 1;

  const creditors = Object.entries(balances)
    .filter(([, v]) => v > 0)
    .map(([name, amount]) => ({ name, amount }))
    .sort(cmp);
  const debtors = Object.entries(balances)
    .filter(([, v]) => v < 0)
    .map(([name, amount]) => ({ name, amount: -amount }))
    .sort(cmp);

  const payments = [];
  let ci = 0;
  let di = 0;
  while (ci < creditors.length && di < debtors.length) {
    const pay = Math.min(creditors[ci].amount, debtors[di].amount);
    if (pay > 0) {
      payments.push({ from: debtors[di].name, to: creditors[ci].name, amount: pay });
    }
    creditors[ci].amount -= pay;
    debtors[di].amount -= pay;
    if (creditors[ci].amount === 0) ci++;
    if (debtors[di].amount === 0) di++;
  }
  return payments;
}

// Sum of all balances. 0 for a well-formed trip; nonzero means some game's pot
// was entered unbalanced.
function residual(balances) {
  return Object.values(balances).reduce((a, b) => a + b, 0);
}

// Head-to-head money flows across many games.
// games: array of games, each an array of { name, net } lines (net = payout - contribution).
// Within one game, each loser's loss is attributed to the winners pro-rata by the
// winners' net wins (winner-takes-all degenerates to exact loser→winner amounts;
// remainders from integer rounding land on the biggest winner). Flows are then
// aggregated across games and opposing directions netted, so each pair appears at
// most once: [{ from, to, amount }] with amount > 0, sorted largest first.
function pairwiseFlows(games) {
  const net = {}; // "loser|winner" -> amount won by `winner` off `loser`
  for (const lines of games) {
    const winners = lines.filter((l) => l.net > 0)
      .sort((a, b) => b.net !== a.net ? b.net - a.net : (a.name < b.name ? -1 : 1));
    const losers = lines.filter((l) => l.net < 0);
    const totalWon = winners.reduce((s, w) => s + w.net, 0);
    if (!winners.length || !losers.length || totalWon <= 0) continue;
    for (const loser of losers) {
      const loss = -loser.net;
      // Floor every share but the biggest winner's; the biggest winner takes the
      // remainder so each loss is fully attributed.
      let assigned = 0;
      for (let i = winners.length - 1; i >= 0; i--) {
        const w = winners[i];
        const share = i === 0 ? loss - assigned : Math.floor((loss * w.net) / totalWon);
        assigned += share;
        if (share !== 0) {
          const key = loser.name + '|' + w.name;
          net[key] = (net[key] || 0) + share;
        }
      }
    }
  }
  // Net opposing directions (A won off B in one game, B off A in another).
  const flows = [];
  const seen = new Set();
  for (const key of Object.keys(net)) {
    const [from, to] = key.split('|');
    const pair = from < to ? from + '|' + to : to + '|' + from;
    if (seen.has(pair)) continue;
    seen.add(pair);
    const ab = net[from + '|' + to] || 0;      // `to` won this much off `from`
    const ba = net[to + '|' + from] || 0;      // `from` won this much off `to`
    const diff = ab - ba;
    if (diff > 0) flows.push({ from, to, amount: diff });
    else if (diff < 0) flows.push({ from: to, to: from, amount: -diff });
  }
  flows.sort((a, b) => b.amount !== a.amount ? b.amount - a.amount : (a.from < b.from ? -1 : 1));
  return flows;
}

// Split a pot by percentage places, whole dollars only.
// presetSplit(200, [70, 20, 10]) -> [140, 40, 20]. Each share is floored and the
// odd-dollar remainder goes to 1st place, so the shares always sum to the pot.
function presetSplit(pot, pcts) {
  const shares = pcts.map((p) => Math.floor((pot * p) / 100));
  shares[0] += pot - shares.reduce((a, b) => a + b, 0);
  return shares;
}

// Cash-game chip counts -> whole-dollar payouts at a rate of `dollars` per
// `count` chips. stacks: [{ id, chips }]. Each exact value is floored and the
// leftover dollars go to the largest fractional remainders (ties: bigger stack),
// so the payouts sum to the exact total whenever that total is whole dollars.
function chipPayouts(stacks, dollars, count) {
  const rows = stacks.map((s, i) => {
    const num = (s.chips || 0) * dollars;
    return { id: s.id, i, chips: s.chips || 0, base: Math.floor(num / count), rem: num % count };
  });
  const totalNum = rows.reduce((t, r) => t + r.chips, 0) * dollars;
  let left = Math.round(totalNum / count) - rows.reduce((t, r) => t + r.base, 0);
  const order = [...rows].sort((a, b) => (b.rem - a.rem) || (b.chips - a.chips) || (a.i - b.i));
  for (const r of order) { if (left <= 0) break; if (r.rem > 0) { r.base += 1; left -= 1; } }
  const out = {};
  for (const r of rows) out[r.id] = r.base;
  return out;
}

// ---------- helpers ----------
const $ = (sel, el = document) => el.querySelector(sel);
const el = (tag, props = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const kid of [].concat(kids)) if (kid) n.append(kid);
  return n;
};
const money = (n) => {

};

// Dollar-amount control: a typed number field plus a slider. Dragging the slider
// at normal speed snaps to $5 steps; dragging very slowly (or arrow keys) moves
// $1 at a time. Typing an exact amount always works and extends the slider range.
// Returns { num, range } elements to place in a flex row (range wraps full-width).
function moneyControl(initial, onSet, cls, pid) {
  let value = Math.max(0, Math.round(initial || 0));
  const maxFor = (v) => Math.max(200, Math.ceil((v + 50) / 100) * 100);
  const num = el('input', { class: 'inp ' + (cls || ''), type: 'number', min: '0', step: '1', inputmode: 'numeric',
    'data-pid': pid || null, value: String(value),
    style: 'width:84px;flex:none;text-align:center;margin-top:0;padding:8px 4px' });
  const range = el('input', { type: 'range', class: 'moneyrange', min: '0', max: String(maxFor(value)), step: '1', value: String(value) });
  // Paint the filled portion of the track orange so the line is clearly visible.
  const paint = () => {
    const max = parseInt(range.max, 10) || 1;
    const pct = Math.min(100, (value / max) * 100);
    range.style.background = 'linear-gradient(to right, var(--accent) ' + pct + '%, #3A4E78 ' + pct + '%)';
  };
  let last = value;
  range.addEventListener('input', () => {
    const raw = parseInt(range.value, 10) || 0;
    const delta = Math.abs(raw - last);
    last = raw;
    value = delta <= 1 ? raw : Math.round(raw / 5) * 5; // slow = $1, fast = snap to $5
    range.value = String(value);
    num.value = String(value);
    paint();
    onSet(value);
  });
  num.addEventListener('input', () => {
    value = Math.max(0, Math.round(parseFloat(num.value) || 0));
    if (value > parseInt(range.max, 10)) range.max = String(maxFor(value));
    range.value = String(value);
    last = value;
    paint();
    onSet(value);
  });
  paint();
  return { num, range };
}

// ---------- self-heal: connection status + resilient reads/writes ----------
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Small fixed pill shown while the app is retrying; cleared on any success.
// Patched directly (no full render) so it never disturbs what the user is doing.
function setConn(ok) {
  state.connOk = ok;
  let pill = document.getElementById('connpill');
  if (ok) { if (pill) pill.remove(); return; }
  if (!pill) {
    pill = el('div', { id: 'connpill', class: 'toast',
      style: 'bottom:auto;top:12px;background:#5A2B10;border-color:var(--accent);z-index:100',
      text: '⚠︎ Reconnecting…' });
    document.body.append(pill);
  }
}

// Write wrapper: every DB write retries on failure (network blips are the norm
// on a trip) before surfacing a clear error. `fn` must BUILD the query so each
// attempt issues a fresh request.
async function dbw(fn, label) {
  for (let i = 0; ; i++) {
    let res;
    try { res = await fn(); } catch (e) { res = { error: e }; }
    if (!res || !res.error) { setConn(true); return res || {}; }
    if (i >= 2) {
      setConn(false);
      toast('⚠︎ ' + label + ' failed — check your connection and try again');
      return res;
    }
    await sleep(400 * Math.pow(2, i));
  }
}

      db.from('games').select('*, game_lines(*)').eq('trip_id', id).order('played_at', { ascending: false }),
      db.from('adjustments').select('*').eq('trip_id', id).order('created_at', { ascending: false }),
    ]);
    // A fetch failure must NOT be mistaken for a deleted trip — keep the last
    // known state on screen and retry instead of dumping the user to the landing.
    if (tripRes.error || playersRes.error || gamesRes.error) {
      throw tripRes.error || playersRes.error || gamesRes.error;
    }
    state.trip = tripRes.data || null;
    state.players = playersRes.data || [];
    state.games = (gamesRes.data || []).map((g) => ({ ...g, lines: g.game_lines || [] }));
    state.adjustmentsAvailable = !adjRes.error;
    state.adjustments = adjRes.data || [];
    state.loading = false;
    setConn(true);
    loadBackoff = 800;
    clearTimeout(loadRetryTimer);
    if (state.trip) rememberTrip(state.trip.id, state.trip.name);
    else if (id) forgetTrip(id); // genuinely deleted elsewhere (fetch succeeded, no row)
    render();
  } catch (_) {
    state.loading = false; // show whatever we already have instead of a spinner
    setConn(false);
    render();
    clearTimeout(loadRetryTimer);
    loadRetryTimer = setTimeout(loadAll, loadBackoff);
    loadBackoff = Math.min(loadBackoff * 2, 10000);
  }
}

// Open a trip in-place (no full reload).
function openTrip(id) {
  state.tripId = id;
  state.trip = null;
  state.loading = true;
  state.homeView = 'home'; // so ☰ returns to the trip list, not a stale History view
  history.replaceState(null, '', location.pathname + '?t=' + id);
  render();
  loadAll();
  subscribeRealtime(id);
}
// Back to the home screen / trip list.
function goHome() {
  unsubscribeRealtime();
  state.tripId = null;
  state.trip = null;
  history.replaceState(null, '', location.pathname);
  render();
}

// Refetch debounce; while the tab is hidden nothing refetches (saves battery
// and bandwidth) — one refetch runs when the tab becomes visible again.
let refetchTimer = null;
let needsRefetch = false;
function scheduleRefetch() {
  if (document.visibilityState === 'hidden') { needsRefetch = true; return; }
  clearTimeout(refetchTimer);
  refetchTimer = setTimeout(loadAll, 150);
}

// Realtime with a full lifecycle: one live channel at a time (no leaks when
// switching trips), and automatic resubscribe with backoff when the socket
// drops — plus a refetch on every (re)subscribe so nothing is missed.
let rtChannel = null;
let rtBackoff = 1000;
function unsubscribeRealtime() {
  if (!rtChannel) return;
  const ch = rtChannel;
  rtChannel = null;
  try { db.removeChannel(ch); } catch (_) {}
}
function subscribeRealtime(id) {
  unsubscribeRealtime();
  const ch = db.channel('trip-' + id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players', filter: 'trip_id=eq.' + id }, scheduleRefetch)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'games', filter: 'trip_id=eq.' + id }, scheduleRefetch)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'game_lines' }, scheduleRefetch)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'adjustments', filter: 'trip_id=eq.' + id }, scheduleRefetch)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trips', filter: 'id=eq.' + id }, scheduleRefetch);
  rtChannel = ch;
  ch.subscribe((status) => {
    if (ch !== rtChannel) return; // superseded by a newer subscription
    if (status === 'SUBSCRIBED') {
      rtBackoff = 1000;
      scheduleRefetch(); // catch anything missed while disconnected
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
      setConn(false);
      const delay = rtBackoff;
      rtBackoff = Math.min(rtBackoff * 2, 15000);
      setTimeout(() => {
        if (state.tripId === id && ch === rtChannel) subscribeRealtime(id);
      }, delay);
    }
  });
}

// A game is "open" (in progress) until someone has been paid.
const gamePaid = (g) => g.lines.reduce((s, l) => s + l.payout, 0);
const gameOpen = (g) => gamePaid(g) === 0;

// derive: flat lines with player names, for the engine (settled games only,
// plus adjustment deltas — cash handoffs and shared expenses)
// Which entries belong to a settlement view: 'all' | 'games' | 'expenses'.
// Cash payments carry their own scope (null = counts only toward All).
function adjInScope(a, scope) {
  if (scope === 'all') return true;
  if (a.kind === 'expense') return scope === 'expenses';
  return a.scope === scope;
}
function tripLines(scope = 'all') {
  const nameById = Object.fromEntries(state.players.map((p) => [p.id, p.name]));
  const out = [];
  for (const g of state.games) {
    if (scope === 'expenses' || gameOpen(g)) continue; // in-progress games don't affect balances yet
    for (const l of g.lines) {
      const name = nameById[l.player_id];
      if (name) out.push({ name, contribution: l.contribution, payout: l.payout });
    }
  }
  for (const a of state.adjustments) {
    if (!adjInScope(a, scope)) continue;
    for (const l of (a.lines || [])) {
      const name = nameById[l.player_id];
      if (!name || !l.delta) continue;
      // delta > 0: owed more at settlement (like a payout); delta < 0: owes more.
      out.push({ name, contribution: l.delta < 0 ? -l.delta : 0, payout: l.delta > 0 ? l.delta : 0 });
    }
  }
  return out;
}
function balances(scope = 'all') { return netBalances(tripLines(scope)); }

// ---------- actions ----------
async function createTrip(name, people = []) {
  // Trip names are unique, ignoring case ("Lake Weekend" == "lake weekend").
  const { data: existing } = await db.from('trips').select('name');
  if ((existing || []).some((t) => (t.name || '').trim().toLowerCase() === name.toLowerCase())) {
    toast('Trip "' + name + '" already exists');
    return;
  }
  const { data, error } = await dbw(() => db
    .from('trips').insert({ name }).select().single(), 'Create trip');
  if (error || !data) return;
  const names = people.map((s) => s.trim()).filter(Boolean);
  if (names.length) {
    await dbw(() => db.from('players').insert(names.map((nm) => ({ trip_id: data.id, name: nm }))), 'Add people');
  }
  state.draftName = ''; state.draftPeople = []; // this trip is made; the next one starts blank
  state.tripId = data.id;
  history.replaceState(null, '', location.pathname + '?t=' + data.id);
  await loadAll();
  subscribeRealtime(data.id);
}
async function addPlayer(name) {
  await dbw(() => db.from('players').insert({ trip_id: state.tripId, name }), 'Add player');
  scheduleRefetch(); // instant feedback for this client; realtime updates the others
}
async function removePlayer(id) {
  await dbw(() => db.from('players').delete().eq('id', id), 'Remove player');
  scheduleRefetch();
}
// Insert a player and return the created row (used for inline add in the game modal).
async function addPlayerReturning(name) {
  const { data, error } = await dbw(() => db.from('players')
    .insert({ trip_id: state.tripId, name }).select().single(), 'Add player');
  scheduleRefetch();
  return error ? null : data;
}
async function saveGame({ id, name, buyin, played_at, lines, mode, chip_dollars, chip_count }) {
  const fields = { name, buyin, played_at, mode, chip_dollars, chip_count };
  // Show the save immediately so reopening the game right away (e.g. to add a
  // rebuy) edits this version, not the pre-save copy still awaiting refetch.
  const showLocally = (gid) => {
    const local = { ...fields, id: gid, trip_id: state.tripId, lines: lines.map((l) => ({ ...l, game_id: gid })) };
    const i = state.games.findIndex((g) => g.id === gid);
    if (i >= 0) state.games[i] = { ...state.games[i], ...local }; else state.games.unshift(local);
    state.games.sort((a, b) => (a.played_at < b.played_at ? 1 : -1));
    render();
  };
  if (id) {
    showLocally(id);
    await dbw(() => db.from('games').update(fields).eq('id', id), 'Save game');
    await dbw(() => db.from('game_lines').delete().eq('game_id', id), 'Save game');
    await dbw(() => db.from('game_lines').insert(lines.map((l) => ({ ...l, game_id: id }))), 'Save game');
  } else {
    const { data, error } = await dbw(() => db.from('games')
      .insert({ trip_id: state.tripId, ...fields }).select().single(), 'Save game');
    if (error || !data) return;
    showLocally(data.id);
    await dbw(() => db.from('game_lines').insert(lines.map((l) => ({ ...l, game_id: data.id }))), 'Save game');
  }
  await rememberGameName(name); // custom names are retained for future games/trips
  scheduleRefetch();
}
async function deleteGame(id) {
  state.games = state.games.filter((g) => g.id !== id); render();
  await dbw(() => db.from('games').delete().eq('id', id), 'Delete game');
  scheduleRefetch();
}
// Permanently delete a trip for everyone (players/games/lines cascade in the DB).
async function deleteTrip(id) {
  const { error } = await dbw(() => db.from('trips').delete().eq('id', id), 'Delete trip');
  if (!error) forgetTrip(id);
}
// Adjustments: { kind: 'cash'|'expense', note, amount, lines: [{player_id, delta}] }
async function saveAdjustment({ id, kind, note, amount, lines, scope }) {
  const fields = { kind, note, amount, lines, scope: kind === 'cash' ? (scope || null) : null };
  if (id) {
    const a = state.adjustments.find((x) => x.id === id);
    if (a) { Object.assign(a, fields); render(); } // show the edit now, not after the refetch
    await dbw(() => db.from('adjustments').update(fields).eq('id', id), 'Save entry');
  } else {
    const { data } = await dbw(() => db.from('adjustments').insert({ trip_id: state.tripId, ...fields }).select().single(), 'Save entry');
    if (data && !state.adjustments.some((x) => x.id === data.id)) { state.adjustments.unshift(data); render(); }
  }
  scheduleRefetch();
}
async function deleteAdjustment(id) {
  state.adjustments = state.adjustments.filter((x) => x.id !== id); render();
  await dbw(() => db.from('adjustments').delete().eq('id', id), 'Delete entry');
  scheduleRefetch();
}

// ---------- render ----------
const root = () => document.getElementById('root');
let pendingRender = false;
function render() {
  const r = root();
  // Never clobber in-progress typing: if the user is mid-entry in a main-screen
  // field, defer this render until they leave the field (modals live outside
  // #root and are unaffected either way).
  const ae = document.activeElement;
  if (ae && r.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.value) {
    pendingRender = true;
    return;
  }
  try {
    r.innerHTML = '';
    if (state.loading) { r.append(el('div', { class: 'empty', text: 'Loading…' })); return; }
    if (state.tripId && !state.trip && !state.connOk) {
      // Trip is unreachable (offline), not deleted — hold here and let the
      // retry loop bring it back rather than dropping to the landing page.
      r.append(el('div', { class: 'empty' }, [
        el('div', { class: 'big', text: '📡' }),
        el('div', { text: 'Reconnecting to your trip…' }),
        el('div', { class: 'muted', style: 'margin-top:6px', text: 'Your data is safe — this retries automatically.' }),
      ]));
      return;
    }
    if (!state.tripId || !state.trip) {
      r.append(state.homeView === 'history' ? renderHistory() : renderLanding());
      return;
    }
    r.append(renderHeader(), renderTabs(), renderBody());
  } catch (err) {
    // Crash containment: never leave a blank screen.
    console.error('render failed', err);
    r.innerHTML = '';
    r.append(el('div', { class: 'empty' }, [
      el('div', { class: 'big', text: '🐻' }),
      el('div', { text: 'Something went wrong.' }),
      el('button', { class: 'btn', style: 'margin-top:12px', text: 'Reload', onclick: () => location.reload() }),
    ]));
  }
}
// Flush a deferred render once the user leaves the field they were typing in.
document.addEventListener('focusout', () => {
  if (pendingRender) { pendingRender = false; setTimeout(render, 60); }
});

function renderLanding() {
  // Draft state lives on `state`, not in local variables here, so this
  // function can be called over and over (self-heal re-renders, a mobile
  // focus-transition edge case, anything) without ever losing what's typed.
  const wrap = el('div', { class: 'wrap' });
  const card = el('div', { class: 'card', style: 'border-top:4px solid var(--accent)' });
  card.append(el('div', { class: 'empty', style: 'padding:24px 20px 8px', html: '<div class="big">🐻🏈</div>' }));
  card.append(el('h1', { text: 'The Ledger', style: 'text-align:center;margin:0 0 2px;letter-spacing:1px;text-transform:uppercase' }));
  card.append(el('p', { style: 'text-align:center;margin:0 0 4px;color:var(--accent);font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:12px', text: 'Bear Down' }));
  card.append(el('p', { class: 'muted', style: 'text-align:center;margin-top:0', text: 'Track poker & game money and shared groceries all weekend, then settle up in the fewest payments.' }));

  const submit = () => { if (!state.draftName.trim()) { toast('Name your trip'); return; } createTrip(state.draftName.trim(), state.draftPeople); };
  const nameInp = el('input', { class: 'inp', placeholder: 'Trip name (e.g. Lake Weekend)', autofocus: 'true', value: state.draftName,
    oninput: (e) => (state.draftName = e.target.value) });
  nameInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  card.append(el('label', { class: 'field', text: 'Trip name' }), nameInp);

  // People on the trip — become this trip's player list.
  card.append(el('label', { class: 'field', text: 'People on the trip' }));
  const chips = el('div', { style: 'display:flex;flex-wrap:wrap;gap:6px;margin-top:6px' });
  const drawChips = () => {
    chips.innerHTML = '';
    state.draftPeople.forEach((nm, i) => chips.append(el('span', { class: 'pill', style: 'cursor:pointer', text: nm + '  ✕',
      title: 'Remove', onclick: () => { state.draftPeople.splice(i, 1); drawChips(); } })));
  };
  drawChips();
  const buf = { v: '' };
  const addPerson = () => { const nm = buf.v.trim(); if (!nm) return; if (!state.draftPeople.includes(nm)) state.draftPeople.push(nm); buf.v = ''; personInp.value = ''; drawChips(); personInp.focus(); };
  const personInp = el('input', { class: 'inp', placeholder: 'Add a name…', oninput: (e) => (buf.v = e.target.value) });
  personInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') addPerson(); });
  card.append(el('div', { class: 'inline', style: 'margin-top:6px' }, [
    el('div', { class: 'grow', style: 'flex:1' }, [personInp]),
    el('button', { class: 'btn ghost small', text: 'Add', onclick: addPerson }),
  ]), chips);
  card.append(el('div', { class: 'muted', style: 'margin-top:6px', text: 'Optional now — you can add or remove people any time on the Players tab.' }));

  const btn = el('button', { class: 'btn block', style: 'margin-top:18px', text: 'Create trip', onclick: submit });
  card.append(btn);
  if (!state.draftName) setTimeout(() => nameInp.focus(), 0); // don't steal focus back once typing has started
  wrap.append(card);

  // Past trips opened on this device.
  const trips = loadTripList();
  if (trips.length) {
    wrap.append(el('div', { class: 'section-h', style: 'margin-top:22px', text: 'Your trips' }));
    for (const t of trips) {
      wrap.append(el('div', { class: 'row-item' }, [
        el('div', { class: 'grow title', text: t.name, style: 'cursor:pointer', onclick: () => openTrip(t.id) }),
        el('button', { class: 'btn small', text: 'Open', onclick: () => openTrip(t.id) }),
      ]));
    }
    wrap.append(el('div', { class: 'muted', style: 'margin-top:8px;text-align:center', text: 'To delete a trip, open it and tap ✕ Delete Trip in the top bar.' }));
  }

  // History across all trips.
  wrap.append(el('button', { class: 'btn ghost block', style: 'margin-top:22px', text: '📊  History (all trips)',
    onclick: () => { state.homeView = 'history'; state.historyRaw = null; render(); } }));
  return wrap;
}

// ---------- history (across all trips) ----------
async function loadHistory() {
  const [g, l, p, t] = await Promise.all([
    db.from('games').select('*'),
    db.from('game_lines').select('*'),
    db.from('players').select('*'),
    db.from('trips').select('*'),
  ]);
  state.historyRaw = { games: g.data || [], lines: l.data || [], players: p.data || [], trips: t.data || [] };
}

function renderHistory() {
  const wrap = el('div', { class: 'wrap' });
  wrap.append(el('div', { class: 'bar', style: 'margin:8px 0 4px' }, [
    el('button', { class: 'btn ghost small', text: '← Back', onclick: () => { state.homeView = 'home'; render(); } }),
    el('div', { class: 'grow', style: 'text-align:center' }, [el('h2', { text: 'History' })]),
    el('span', { style: 'display:inline-block;width:60px' }),
  ]));

  if (!state.historyRaw) {
    wrap.append(el('div', { class: 'empty', text: 'Loading…' }));
    loadHistory().then(() => { if (state.homeView === 'history') render(); });
    return wrap;
  }

  const { games, lines, players, trips } = state.historyRaw;
  if (!games.length) { wrap.append(el('div', { class: 'empty', text: 'No games recorded yet.' })); return wrap; }

  const pname = Object.fromEntries(players.map((p) => [p.id, p.name]));
  const tripById = Object.fromEntries((trips || []).map((t) => [t.id, t]));
  const linesByGame = {};
  for (const l of lines) (linesByGame[l.game_id] || (linesByGame[l.game_id] = [])).push(l);

  // Finished games only — in-progress games have no result yet and adjustments
  // (transfers/expenses) are not gambling outcomes, so neither is counted here.
  const finished = games.filter((g) => (linesByGame[g.id] || []).some((l) => l.payout > 0));

  let total = 0;
  const byYear = {}, byGame = {}, byPerson = {}, byTrip = {};
  // gameNets: per finished game, [{name, net}] — feeds leaderboard/head-to-head/records
  const gameNets = [];
  for (const g of finished) {
    const ls = linesByGame[g.id] || [];
    const nets = [];
    let moved = 0, pot = 0;
    for (const l of ls) {
      const net = l.payout - l.contribution;
      pot += l.contribution;
      if (net > 0) moved += net;                 // money that changed hands this game
      const nm = pname[l.player_id];
      if (!nm) continue;
      byPerson[nm] = (byPerson[nm] || 0) + net;
      nets.push({ name: nm, net, contribution: l.contribution });
    }
    gameNets.push({ gname: g.name, when: g.played_at, pot, lines: nets });
    total += moved;
    const yr = new Date(g.played_at).getFullYear();
    byYear[yr] = (byYear[yr] || 0) + moved;
    byGame[g.name] = (byGame[g.name] || 0) + moved;
    const bt = byTrip[g.trip_id] || (byTrip[g.trip_id] = { moved: 0, games: 0 });
    bt.moved += moved; bt.games += 1;
  }

  wrap.append(el('div', { class: 'card', style: 'text-align:center;border-top:4px solid var(--accent)' }, [
    el('div', { class: 'muted', text: 'Total money that changed hands (all time)' }),
    el('div', { class: 'money', style: 'font-size:30px;margin-top:4px', text: money(total) }),
    el('div', { class: 'muted', style: 'margin-top:4px', text: finished.length + ' games · ' + Object.keys(byTrip).length + ' trip(s) · ' + Object.keys(byYear).length + ' year(s)' }),
  ]));

  // ---- Leaderboard (per person: played, wins, win %, biggest win, lifetime net)
  const stats = {};
  for (const g of gameNets) {
    for (const l of g.lines) {
      const s = stats[l.name] || (stats[l.name] = { played: 0, wins: 0, net: 0, biggest: 0, maxStake: 0, streak: 0, bestStreak: 0 });
      s.played += 1;
      s.net += l.net;
      if (l.net > 0) s.wins += 1;
      if (l.net > s.biggest) s.biggest = l.net;
      if (l.contribution > s.maxStake) s.maxStake = l.contribution;
    }
  }
  // win streaks: walk games in time order
  for (const g of [...gameNets].sort((a, b) => (a.when < b.when ? -1 : 1))) {
    for (const l of g.lines) {
      const s = stats[l.name];
      s.streak = l.net > 0 ? s.streak + 1 : 0;
      if (s.streak > s.bestStreak) s.bestStreak = s.streak;
    }
  }
  wrap.append(el('div', { class: 'section-h', style: 'margin-top:18px', text: 'Leaderboard' }));
  Object.entries(stats).sort((a, b) => b[1].net - a[1].net).forEach(([nm, s], i) => {
    const medal = ['🥇', '🥈', '🥉'][i] || '';
    wrap.append(el('div', { class: 'row-item' }, [
      el('div', { class: 'grow' }, [
        el('div', { class: 'title', text: nm }),
        el('div', { class: 'muted', text: (medal ? medal + ' ' : '') + s.wins + '–' + (s.played - s.wins) +
          ' · ' + Math.round((s.wins / s.played) * 100) + '% wins · biggest ' + signed(s.biggest) }),
      ]),
      el('div', { class: s.net > 0 ? 'pos' : s.net < 0 ? 'neg' : 'zero', text: signed(s.net) }),
    ]));
  });

  // ---- Head-to-head (who owns whom, losses attributed pro-rata to winners)
  const flows = pairwiseFlows(gameNets.map((g) => g.lines));
  wrap.append(el('div', { class: 'section-h', style: 'margin-top:18px', text: 'Head-to-head' }));
  if (!flows.length) wrap.append(el('div', { class: 'muted', text: 'No finished games yet.' }));
  flows.slice(0, 15).forEach((f) => {
    wrap.append(el('div', { class: 'row-item' }, [
      el('div', { class: 'grow title', text: f.to + ' over ' + f.from }),
      el('div', { class: 'money', text: money(f.amount) }),
    ]));
  });
  if (flows.length > 15) wrap.append(el('div', { class: 'muted', style: 'margin-top:6px;text-align:center', text: '+ ' + (flows.length - 15) + ' more pairs' }));

  // ---- Records
  wrap.append(el('div', { class: 'section-h', style: 'margin-top:18px', text: 'Records' }));
  if (gameNets.length) {
    const biggestPot = gameNets.reduce((a, b) => (b.pot > a.pot ? b : a));
    let bigWin = { name: '—', net: 0, gname: '' };
    for (const g of gameNets) for (const l of g.lines) if (l.net > bigWin.net) bigWin = { name: l.name, net: l.net, gname: g.gname };
    const streakKing = Object.entries(stats).reduce((a, b) => (b[1].bestStreak > a[1].bestStreak ? b : a));
    const stakeKing = Object.entries(stats).reduce((a, b) => (b[1].maxStake > a[1].maxStake ? b : a));
    const rec = (label, val) => wrap.append(el('div', { class: 'row-item' }, [
      el('div', { class: 'grow muted', text: label }),
      el('div', { class: 'money', text: val }),
    ]));
    rec('Biggest pot — ' + biggestPot.gname, money(biggestPot.pot));
    rec('Biggest single win — ' + bigWin.name + ' · ' + bigWin.gname, signed(bigWin.net));
    rec('Longest win streak — ' + streakKing[0], streakKing[1].bestStreak + ' game' + (streakKing[1].bestStreak === 1 ? '' : 's'));
    rec('Largest single stake — ' + stakeKing[0], money(stakeKing[1].maxStake));
  } else {
    wrap.append(el('div', { class: 'muted', text: 'No finished games yet.' }));
  }

  // ---- Player profiles (lifetime net by game type; tap to expand)
  const profile = {}; // name -> { gname: net }
  for (const g of gameNets) for (const l of g.lines) {
    (profile[l.name] || (profile[l.name] = {}))[g.gname] = ((profile[l.name] || {})[g.gname] || 0) + l.net;
  }
  wrap.append(el('div', { class: 'section-h', style: 'margin-top:18px', text: 'Player profiles — best & worst games' }));
  for (const [nm, perGame] of Object.entries(profile).sort((a, b) => a[0] < b[0] ? -1 : 1)) {
    const entries = Object.entries(perGame).sort((a, b) => b[1] - a[1]);
    const best = entries[0];
    const worst = entries[entries.length - 1];
    const open = expandedProfiles.has(nm);
    const row = el('div', { class: 'row-item', style: 'flex-wrap:wrap', onclick: () => {
      if (expandedProfiles.has(nm)) expandedProfiles.delete(nm); else expandedProfiles.add(nm);
      render();
    } }, [
      el('div', { class: 'grow' }, [
        el('div', { class: 'title', text: (open ? '▾ ' : '▸ ') + nm }),
        el('div', { class: 'muted', text: 'Best: ' + best[0] + ' ' + signed(best[1]) +
          (worst[0] !== best[0] ? ' · Worst: ' + worst[0] + ' ' + signed(worst[1]) : '') }),
      ]),
    ]);
    if (open) {
      const detail = el('div', { style: 'width:100%;margin-top:8px' });
      for (const [gn, v] of entries) {
        detail.append(el('div', { class: 'inline', style: 'justify-content:space-between;padding:3px 0' }, [
          el('span', { class: 'muted', text: gn }),
          el('span', { class: v > 0 ? 'pos' : v < 0 ? 'neg' : 'zero', style: 'font-size:13px', text: signed(v) }),
        ]));
      }
      row.append(detail);
    }
    wrap.append(row);
  }

  const section = (title, rows) => {
    wrap.append(el('div', { class: 'section-h', style: 'margin-top:18px', text: title }));
    if (!rows.length) { wrap.append(el('div', { class: 'muted', text: 'None yet.' })); return; }
    for (const [label, val, cls] of rows) {
      wrap.append(el('div', { class: 'row-item' }, [
        el('div', { class: 'grow title', text: label }),
        el('div', { class: cls || 'money', text: val }),
      ]));
    }
  };

  // By trip — tap to open that trip.
  wrap.append(el('div', { class: 'section-h', style: 'margin-top:18px', text: 'By trip' }));
  Object.entries(byTrip)
    .map(([tid, v]) => ({ tid, ...v, t: tripById[tid] }))
    .sort((a, b) => b.moved - a.moved)
    .forEach((r) => {
      wrap.append(el('div', { class: 'row-item', style: 'cursor:pointer', onclick: () => openTrip(r.tid) }, [
        el('div', { class: 'grow' }, [
          el('div', { class: 'title', text: r.t ? r.t.name : 'Trip' }),
          el('div', { class: 'muted', text: r.games + ' game' + (r.games === 1 ? '' : 's') + (r.t ? ' · ' + new Date(r.t.date || r.t.created_at).toLocaleDateString() : '') }),
        ]),
        el('div', { class: 'money', text: money(r.moved) }),
      ]));
    });

  section('By year', Object.entries(byYear).sort((a, b) => b[0] - a[0]).map(([y, v]) => [String(y), money(v)]));
  section('By game', Object.entries(byGame).sort((a, b) => b[1] - a[1]).map(([g, v]) => [g, money(v)]));

  return wrap;
}

// ---------- 🎲 Games portal (cash & poker) ----------
function renderGames() {
  const box = el('div', {});
  box.append(portalHead('🎲 Games', 'Poker, cash games and everything played for money.'));
  if (!state.players.length) { noPlayersEmpty(box, '🎲'); return box; }
  box.append(el('button', { class: 'btn block', style: 'margin-top:10px', text: '＋ New game', onclick: () => openGameModal(null) }));

  const nameById = Object.fromEntries(state.players.map((p) => [p.id, p.name]));
  const finished = state.games.filter((g) => !gameOpen(g));
  const openN = state.games.length - finished.length;
  if (finished.length) {
    const b = balances('games');
    const wins = {}, played = {};
    for (const g of finished) for (const l of g.lines) {
      played[l.player_id] = (played[l.player_id] || 0) + 1;
      if (l.payout > l.contribution) wins[l.player_id] = (wins[l.player_id] || 0) + 1;
    }
    const rows = state.players.filter((p) => played[p.id]).map((p) => ({
      name: p.name, net: b[p.name] ?? 0, sub: (wins[p.id] || 0) + ' won of ' + played[p.id] + ' played' }))
      .sort((x, y) => (y.net - x.net) || (x.name < y.name ? -1 : 1));
    box.append(el('div', { class: 'section-h', text: 'Standings — games only' }), netRows(rows));
  }
  if (openN) box.append(el('div', { class: 'muted', style: 'margin-top:8px', text: '⏳ ' + openN + ' game' + (openN === 1 ? '' : 's') + ' in progress — tap to add rebuys or enter the result.' }));

  if (!state.games.length) {
    box.append(el('div', { class: 'empty', html: '<div class="big">🃏</div>No games yet.<br>Tap ＋ New game to start one.' }));
    return box;
  }
  box.append(el('div', { class: 'section-h', text: 'All games' }));
  for (const g of state.games) {
    const pot = g.lines.reduce((s, l) => s + l.contribution, 0);
    const paid = g.lines.reduce((s, l) => s + l.payout, 0);
    const winner = g.lines.filter((l) => l.payout - l.contribution > 0)
      .sort((a, b) => (b.payout - b.contribution) - (a.payout - a.contribution))[0];
    const meta = [fmtTime(g.played_at), g.lines.length + ' players'];
    if (g.mode === 'chips') meta.push('🪙 cash game');
    const rb = g.lines.reduce((s, l) => s + (l.rebuys || 0), 0);
    if (rb) meta.push('🔁 ' + rb + ' rebuy' + (rb === 1 ? '' : 's'));
    if (paid === 0) meta.push('⏳ in progress');
    else if (winner) meta.push('👑 ' + (nameById[winner.player_id] || '?'));
    if (paid !== 0 && pot !== paid) meta.push('⚠︎ unbalanced');
    box.append(el('div', { class: 'row-item', onclick: () => openGameModal(g) }, [
      el('div', { class: 'grow' }, [
        el('div', { class: 'title', text: g.name }),
        el('div', { class: 'muted', text: meta.join('  ·  ') }),
      ]),
      el('div', { class: 'money', text: money(pot) }),
    ]));
  }
  return box;
}

// One-line description of an adjustment, e.g. "Ryan → Dugan · cash" or "Bill fronted ÷ 4".
function adjSummary(a, nameById) {
  const lines = a.lines || [];
  const payer = lines.find((l) => l.delta > 0);
  if (a.kind === 'cash') {
    const recv = lines.find((l) => l.delta < 0);
    return (nameById[payer?.player_id] || '?') + ' → ' + (nameById[recv?.player_id] || '?') + ' · cash';
  }
  const owers = lines.filter((l) => l.delta < 0).length;
  return (nameById[payer?.player_id] || '?') + ' fronted · split ÷ ' + (owers + 1);
}
const SCOPE_LABEL = { all: 'All', games: '🎲 Games', expenses: '🧾 Expenses' };

// ---------- 💰 Settle Up (All / Games / Expenses) ----------
function renderSettle() {
  const box = el('div', {});
  const scope = state.settleScope;
  box.append(portalHead('💰 Settle Up', 'Settle everything at once, or games and expenses separately.'));
  const seg = el('div', { class: 'inline', style: 'margin-top:10px;gap:6px' });
  for (const k of ['all', 'games', 'expenses']) {
    seg.append(el('button', { class: 'btn small scopebtn ' + (scope === k ? '' : 'ghost'), style: 'flex:1', text: SCOPE_LABEL[k],
      onclick: () => { state.settleScope = k; render(); } }));
  }
  box.append(seg);
  if (!state.players.length) { box.append(el('div', { class: 'empty', text: 'Add players first.' })); return box; }

  const nameById = Object.fromEntries(state.players.map((p) => [p.id, p.name]));
  const idByName = Object.fromEntries(state.players.map((p) => [p.name, p.id]));
  const openCount = scope === 'expenses' ? 0 : state.games.filter(gameOpen).length;
  if (openCount) box.append(el('div', { class: 'card', style: 'border-color:var(--gold)' }, [
    el('div', { class: 'muted', text: '⏳ ' + openCount + ' game' + (openCount === 1 ? '' : 's') + ' in progress — not counted until the result is entered.' }),
  ]));
  const cashHere = state.adjustments.filter((a) => a.kind === 'cash' && adjInScope(a, scope));
  if (scope !== 'all' && state.adjustments.some((a) => a.kind === 'cash' && !a.scope)) {
    box.append(el('div', { class: 'muted', style: 'margin-top:8px', text: 'Payments recorded under "All" only count in the All view.' }));
  }

  const b = balances(scope);
  const anything = (scope !== 'expenses' && state.games.some((g) => !gameOpen(g)))
    || state.adjustments.some((a) => adjInScope(a, scope));
  if (!anything) {
    box.append(el('div', { class: 'empty', text: scope === 'expenses' ? 'No expenses yet — nothing to settle.' : scope === 'games' ? 'No finished games yet — nothing to settle.' : 'Nothing to settle yet.' }));
    box.append(recordPaymentBtn(scope));
    return box;
  }

  // Balances, with the per-section breakdown in the All view.
  const parts = scope === 'all' ? { g: balances('games'), e: balances('expenses') } : null;
  const rows = state.players.map((p) => {
    let sub = null;
    if (parts) {
      const g = parts.g[p.name] ?? 0, e = parts.e[p.name] ?? 0, c = (b[p.name] ?? 0) - g - e;
      sub = ['🎲 ' + signed(g), '🧾 ' + signed(e)].concat(c ? ['💵 ' + signed(c)] : []).join('  ·  ');
    }
    return { name: p.name, net: b[p.name] ?? 0, sub };
  }).sort((x, y) => (y.net - x.net) || (x.name < y.name ? -1 : 1));
  box.append(el('div', { class: 'section-h', text: 'Balances — ' + SCOPE_LABEL[scope] }), netRows(rows));
  box.append(el('div', { class: 'muted', style: 'margin-top:6px;text-align:center;font-size:12px', text: 'Positive = they are owed.  Negative = they owe.' }));

  const payments = minimize(b);
  const res = residual(b);
  if (res !== 0) {
    box.append(el('div', { class: 'card', style: 'border-color:var(--accent)' }, [
      el('div', { class: 'neg', text: '⚠︎ A game pot is unbalanced (off by ' + money(Math.abs(res)) + '). Fix it in Games for an exact settlement.' }),
    ]));
  }
  if (!payments.length) {
    box.append(el('div', { class: 'empty', html: '<div class="big">✅</div><b>All square</b><br>No payments needed.' }));
  } else {
    box.append(el('div', { class: 'section-h', text: payments.length + ' payment' + (payments.length === 1 ? '' : 's') + ' to settle' }));
    for (const p of payments) {
      box.append(el('div', { class: 'row-item payrow' }, [
        el('div', { class: 'grow', html: '<b>' + escapeHtml(p.from) + '</b> &rarr; <b>' + escapeHtml(p.to) + '</b>' }),
        el('div', { class: 'money', text: money(p.amount) }),
        el('button', { class: 'btn ghost small paidbtn', style: 'margin-left:8px', text: '✓ Paid', onclick: () => {
          if (!confirm('Record that ' + p.from + ' paid ' + p.to + ' ' + money(p.amount) + '?')) return;
          saveAdjustment({ id: null, kind: 'cash', note: 'Settle up', amount: p.amount, scope: scope === 'all' ? null : scope,
            lines: [{ player_id: idByName[p.from], delta: p.amount }, { player_id: idByName[p.to], delta: -p.amount }] });
          toast('Recorded ' + p.from + ' → ' + p.to + ' ' + money(p.amount));
        } }),
      ]));
    }
  }
  box.append(recordPaymentBtn(scope));

  if (cashHere.length) {
    box.append(el('div', { class: 'section-h', text: 'Payments recorded' }));
    for (const a of [...cashHere].sort((x, y) => (x.created_at < y.created_at ? 1 : -1))) {
      box.append(el('div', { class: 'row-item', onclick: () => openAdjGuarded(a) }, [
        el('div', { class: 'grow' }, [
          el('div', { class: 'title', text: '💵 ' + adjSummary(a, nameById) }),
          el('div', { class: 'muted', text: fmtTime(a.created_at) + '  ·  ' + SCOPE_LABEL[a.scope || 'all'] + (a.note ? '  ·  ' + a.note : '') }),
        ]),
        el('div', { class: 'money', text: money(a.amount || 0) }),
      ]));
    }
  }
  appendStatementsAndExport(box, b, payments, scope);
  return box;
}
function recordPaymentBtn(scope) {
  return el('button', { class: 'btn ghost block', style: 'margin-top:12px', text: '💵 Record a cash payment',
    onclick: () => openAdjGuarded(null, 'cash', { scope: scope === 'all' ? null : scope }) });

// ---------- statements + export ----------

async function copyText(text, doneMsg) {
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
  } catch (_) { /* fall through to clipboard */ }
  try { await navigator.clipboard.writeText(text); toast(doneMsg); }
  catch (_) { toast('Could not copy'); }
}

function settlementText(payments) {
  const head = '🐻 The Ledger — ' + state.trip.name + (state.settleScope !== 'all' ? ' (' + SCOPE_LABEL[state.settleScope].replace(/^\S+ /, '') + ')' : '') + '\n';
  if (!payments.length) return head + 'All square — no payments needed.';
  return head + 'Settle up (' + payments.length + ' payment' + (payments.length === 1 ? '' : 's') + '):\n' +
    payments.map((p) => p.from + ' → ' + p.to + ': ' + money(p.amount)).join('\n');
}

// Per-player statement: every finished game they played, adjustments, total, settlement role.
function playerStatement(name, bals, payments, scope = 'all') {
  const nameById = Object.fromEntries(state.players.map((p) => [p.id, p.name]));
  const rows = [];
  const chronGames = [...state.games].sort((a, b) => (a.played_at < b.played_at ? -1 : 1));
  for (const g of scope === 'expenses' ? [] : chronGames) {
    const line = g.lines.find((l) => nameById[l.player_id] === name);
    if (!line) continue;
    if (gameOpen(g)) rows.push({ label: g.name + ' (' + fmtTime(g.played_at) + ')', text: 'in progress' });
    else rows.push({ label: g.name + ' (' + fmtTime(g.played_at) + ')', net: line.payout - line.contribution });
  }
  for (const a of state.adjustments) {
    if (!adjInScope(a, scope)) continue;
    const line = (a.lines || []).find((l) => nameById[l.player_id] === name);
    if (!line || !line.delta) continue;
    rows.push({ label: (a.kind === 'expense' ? '🧾 ' : '💵 ') + adjSummary(a, nameById) + (a.note ? ' — ' + a.note : ''), net: line.delta });
  }
  const total = bals[name] ?? 0;
  const pays = payments.filter((p) => p.from === name);
  const gets = payments.filter((p) => p.to === name);
  let settle;
  if (pays.length) settle = 'Pays: ' + pays.map((p) => p.to + ' ' + money(p.amount)).join(', ');
  else if (gets.length) settle = 'Collects: ' + gets.map((p) => p.from + ' ' + money(p.amount)).join(', ');
  else settle = 'All square';
  return { rows, total, settle };
}

function statementText(name, st) {
  return name + ' — ' + state.trip.name + '\n' +
    st.rows.map((r) => r.label + ': ' + (r.net != null ? signed(r.net) : r.text)).join('\n') +
    '\nTotal: ' + signed(st.total) + '\n' + st.settle;
}

// Full journal CSV: one row per game line and adjustment line.
function journalCsv() {
  const nameById = Object.fromEntries(state.players.map((p) => [p.id, p.name]));
  const esc = (v) => '"' + String(v).replaceAll('"', '""') + '"';
  const rows = [['section', 'type', 'name', 'time', 'player', 'in', 'out', 'net', 'rebuys', 'end chips']];
  for (const g of [...state.games].sort((a, b) => (a.played_at < b.played_at ? -1 : 1))) {
    for (const l of g.lines) {
      rows.push(['games', 'game', g.name, g.played_at, nameById[l.player_id] || '?', l.contribution, l.payout, l.payout - l.contribution, l.rebuys || 0, l.chips ?? '']);
    }
  }
  for (const a of state.adjustments) {
    for (const l of (a.lines || [])) {
      rows.push([a.kind === 'expense' ? 'expenses' : (a.scope || 'all'), a.kind, a.note || adjSummary(a, nameById), a.created_at, nameById[l.player_id] || '?',
        l.delta < 0 ? -l.delta : 0, l.delta > 0 ? l.delta : 0, l.delta, '', '']);
    }
  }
  return rows.map((r) => r.map(esc).join(',')).join('\n');
}

function downloadCsv() {
  const blob = new Blob([journalCsv()], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: 'the-ledger-' + state.trip.name.replace(/[^\w-]+/g, '_') + '.csv' });
  document.body.append(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 500);
}
