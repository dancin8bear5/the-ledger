<title>The Ledger</title>
<style>
  /* Chicago Bears palette: navy #0B162A, orange #C83803, white */

    --bg: #0B162A; --surface: #152238; --elevated: #1F2F4E;

    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);

  input, select { font: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 96px; }

  /* Header */

    position: sticky; top: 0; z-index: 20; background: var(--bg);
    padding: 14px 16px 10px; border-bottom: 3px solid var(--accent);

  .balance-ok { color: var(--pos); font-weight: 700; }

  .toast {

<script type="module">

// The Ledger — settlement engine.
//
// Pure functions, no dependencies. This is the single source of truth for the
// who-owes-whom math; it is imported by the Node tests and inlined into
// index.html at build time. All money is whole-dollar integers.

// Net balance per player across a set of game lines.
// lines: [{ name, contribution, payout }]
// Returns { [name]: net } where net = sum(payout - contribution).
// Positive = the player is owed money; negative = the player owes.
function netBalances(lines) {
  const balances = {};
  for (const l of lines) {
    balances[l.name] = (balances[l.name] ?? 0) + (l.payout - l.contribution);
  }
  return balances;
}

// Minimize the number of payments that settle everyone.
// Greedy max-creditor / max-debtor: repeatedly match the person owed the most
// with the person who owes the most, settling the smaller amount each time.
// Produces at most (n - 1) payments. Deterministic (ties broken by name).
// Returns [{ from, to, amount }] (from pays to).
function minimize(balances) {
  const cmp = (a, b) =>
    a.amount !== b.amount ? b.amount - a.amount : a.name < b.name ? -1 : 1;

  const creditors = Object.entries(balances)
    .filter(([, v]) => v > 0)
    .map(([name, amount]) => ({ name, amount }))
    .sort(cmp);
  const debtors = Object.entries(balances)
    .filter(([, v]) => v < 0)
    .map(([name, amount]) => ({ name, amount: -amount }))
    .sort(cmp);

  const payments = [];
  let ci = 0;
  let di = 0;
  while (ci < creditors.length && di < debtors.length) {
    const pay = Math.min(creditors[ci].amount, debtors[di].amount);
    if (pay > 0) {
      payments.push({ from: debtors[di].name, to: creditors[ci].name, amount: pay });
    }
    creditors[ci].amount -= pay;
    debtors[di].amount -= pay;
    if (creditors[ci].amount === 0) ci++;
    if (debtors[di].amount === 0) di++;
  }
  return payments;
}

// Sum of all balances. 0 for a well-formed trip; nonzero means some game's pot
// was entered unbalanced.
function residual(balances) {
  return Object.values(balances).reduce((a, b) => a + b, 0);
}

// Head-to-head money flows across many games.
// games: array of games, each an array of { name, net } lines (net = payout - contribution).
// Within one game, each loser's loss is attributed to the winners pro-rata by the
// winners' net wins (winner-takes-all degenerates to exact loser→winner amounts;
// remainders from integer rounding land on the biggest winner). Flows are then
// aggregated across games and opposing directions netted, so each pair appears at
// most once: [{ from, to, amount }] with amount > 0, sorted largest first.
function pairwiseFlows(games) {
  const net = {}; // "loser|winner" -> amount won by `winner` off `loser`
  for (const lines of games) {
    const winners = lines.filter((l) => l.net > 0)
      .sort((a, b) => b.net !== a.net ? b.net - a.net : (a.name < b.name ? -1 : 1));
    const losers = lines.filter((l) => l.net < 0);
    const totalWon = winners.reduce((s, w) => s + w.net, 0);
    if (!winners.length || !losers.length || totalWon <= 0) continue;
    for (const loser of losers) {
      const loss = -loser.net;
      // Floor every share but the biggest winner's; the biggest winner takes the
      // remainder so each loss is fully attributed.
      let assigned = 0;
      for (let i = winners.length - 1; i >= 0; i--) {
        const w = winners[i];
        const share = i === 0 ? loss - assigned : Math.floor((loss * w.net) / totalWon);
        assigned += share;
        if (share !== 0) {
          const key = loser.name + '|' + w.name;
          net[key] = (net[key] || 0) + share;
        }
      }
    }
  }
  // Net opposing directions (A won off B in one game, B off A in another).
  const flows = [];
  const seen = new Set();
  for (const key of Object.keys(net)) {
    const [from, to] = key.split('|');
    const pair = from < to ? from + '|' + to : to + '|' + from;
    if (seen.has(pair)) continue;
    seen.add(pair);
    const ab = net[from + '|' + to] || 0;      // `to` won this much off `from`
    const ba = net[to + '|' + from] || 0;      // `from` won this much off `to`
    const diff = ab - ba;
    if (diff > 0) flows.push({ from, to, amount: diff });
    else if (diff < 0) flows.push({ from: to, to: from, amount: -diff });
  }
  flows.sort((a, b) => b.amount !== a.amount ? b.amount - a.amount : (a.from < b.from ? -1 : 1));
  return flows;
}

// Split a pot by percentage places, whole dollars only.
// presetSplit(200, [70, 20, 10]) -> [140, 40, 20]. Each share is floored and the
// odd-dollar remainder goes to 1st place, so the shares always sum to the pot.
function presetSplit(pot, pcts) {
  const shares = pcts.map((p) => Math.floor((pot * p) / 100));
  shares[0] += pot - shares.reduce((a, b) => a + b, 0);
  return shares;
}

// ---------- helpers ----------
const $ = (sel, el = document) => el.querySelector(sel);
const el = (tag, props = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const kid of [].concat(kids)) if (kid) n.append(kid);
  return n;
};
const money = (n) => {
  const s = n < 0 ? '-' : '';
  return s + '$' + Math.abs(n).toLocaleString('en-US');
};
const signed = (n) => (n > 0 ? '+' : '') + money(n);
const fmtTime = (iso) =>
  new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

function toast(msg) {
  const t = el('div', { class: 'toast', text: msg });
  document.body.append(t);
  setTimeout(() => t.remove(), 1900);
}

// Dollar-amount control: a typed number field plus a slider. Dragging the slider
// at normal speed snaps to $5 steps; dragging very slowly (or arrow keys) moves
// $1 at a time. Typing an exact amount always works and extends the slider range.
// Returns { num, range } elements to place in a flex row (range wraps full-width).
function moneyControl(initial, onSet, cls, pid) {
  let value = Math.max(0, Math.round(initial || 0));
  const maxFor = (v) => Math.max(200, Math.ceil((v + 50) / 100) * 100);
  const num = el('input', { class: 'inp ' + (cls || ''), type: 'number', min: '0', step: '1', inputmode: 'numeric',
    'data-pid': pid || null, value: String(value),
    style: 'width:84px;flex:none;text-align:center;margin-top:0;padding:8px 4px' });
  const range = el('input', { type: 'range', class: 'moneyrange', min: '0', max: String(maxFor(value)), step: '1', value: String(value) });
  let last = value;
  range.addEventListener('input', () => {
    const raw = parseInt(range.value, 10) || 0;
    const delta = Math.abs(raw - last);
    last = raw;
    value = delta <= 1 ? raw : Math.round(raw / 5) * 5; // slow = $1, fast = snap to $5
    range.value = String(value);
    num.value = String(value);
    onSet(value);
  });
  num.addEventListener('input', () => {
    value = Math.max(0, parseInt(num.value || '0', 10));
    if (value > parseInt(range.max, 10)) range.max = String(maxFor(value));
    range.value = String(value);
    last = value;
    onSet(value);
  });
  return { num, range };
}

// Built-in games for the New Game dropdown; "Other…" reveals a free-text field.
// Custom names get saved (custom_games) and merged in via allGameNames().
const PRESET_GAMES = [
  '3s & 9s', '3-5-7', '5 Card Draw', '5 Card Stud', 'Hi-Low', 'Razz',
  'Kings and Little Men', 'High Card', 'Low-Chi', "Hold 'Em",
  'Yahtzee', 'Screw Your Neighbor',
];
// Preset + saved custom games, de-duplicated (case-sensitive on stored form).
const allGameNames = () => Array.from(new Set([...PRESET_GAMES, ...state.customGames]));
const isKnownGame = (n) => PRESET_GAMES.includes(n) || state.customGames.includes(n);

// Remember trips this browser has opened, so the home screen can list them.
const TRIPS_KEY = 'ledger.trips';
const loadTripList = () => { try { return JSON.parse(localStorage.getItem(TRIPS_KEY) || '[]'); } catch { return []; } };
function rememberTrip(id, name) {
  const list = loadTripList().filter((t) => t.id !== id);
  list.unshift({ id, name, ts: Date.now() });
  localStorage.setItem(TRIPS_KEY, JSON.stringify(list.slice(0, 30)));
}
const forgetTrip = (id) => localStorage.setItem(TRIPS_KEY, JSON.stringify(loadTripList().filter((t) => t.id !== id)));

// ---------- state ----------
let state = {
  tripId: new URLSearchParams(location.search).get('t'),
  trip: null,
  players: [],
  games: [],   // each: {..., lines: [{player_id, contribution, payout}]}
  tab: 'games',
  loading: true,
  customGames: [],       // saved custom game names (global)
  homeView: 'home',      // 'home' | 'history' when no trip is open
  historyRaw: null,      // { games, lines, players, trips } across all trips
  adjustments: [],       // this trip's cash handoffs / shared expenses
  adjustmentsAvailable: true, // false when the adjustments table doesn't exist yet
};

// Global custom game names (retained across trips/devices).
async function loadCustomGames() {
  try {
    const { data } = await db.from('custom_games').select('name').order('name');
    state.customGames = (data || []).map((r) => r.name);
  } catch (_) { state.customGames = state.customGames || []; }
}
async function rememberGameName(name) {
  const n = (name || '').trim();
  if (!n || isKnownGame(n)) return;
  try { await db.from('custom_games').insert({ name: n }); } catch (_) {}
  if (!state.customGames.includes(n)) state.customGames.push(n);
}

// ---------- data ----------
async function loadAll() {
  const id = state.tripId;
  if (!id) { state.loading = false; return render(); }
  const [{ data: trip }, { data: players }, { data: games }, adjRes] = await Promise.all([
    db.from('trips').select('*').eq('id', id).maybeSingle(),
    db.from('players').select('*').eq('trip_id', id).order('name'),
    db.from('games').select('*, game_lines(*)').eq('trip_id', id).order('played_at', { ascending: false }),
    db.from('adjustments').select('*').eq('trip_id', id).order('created_at', { ascending: false }),
  ]);
  state.trip = trip || null;
  state.players = players || [];
  state.games = (games || []).map((g) => ({ ...g, lines: g.game_lines || [] }));
  state.adjustmentsAvailable = !adjRes.error;
  state.adjustments = adjRes.data || [];
  state.loading = false;
  if (state.trip) rememberTrip(state.trip.id, state.trip.name);
  else if (id) forgetTrip(id); // trip was deleted elsewhere
  render();
}

// Open a trip in-place (no full reload).
function openTrip(id) {
  state.tripId = id;
  state.trip = null;
  state.loading = true;
  history.replaceState(null, '', location.pathname + '?t=' + id);
  render();
  loadAll();
  subscribeRealtime(id);
}
// Back to the home screen / trip list.
function goHome() {
  state.tripId = null;
  state.trip = null;
  history.replaceState(null, '', location.pathname);
  render();
}

let refetchTimer = null;
function scheduleRefetch() {
  clearTimeout(refetchTimer);
  refetchTimer = setTimeout(loadAll, 150);
}

function subscribeRealtime(id) {
  db.channel('trip-' + id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players', filter: 'trip_id=eq.' + id }, scheduleRefetch)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'games', filter: 'trip_id=eq.' + id }, scheduleRefetch)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'game_lines' }, scheduleRefetch)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'adjustments', filter: 'trip_id=eq.' + id }, scheduleRefetch)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trips', filter: 'id=eq.' + id }, scheduleRefetch)
    .subscribe();
}

// A game is "open" (in progress) until someone has been paid.
const gamePaid = (g) => g.lines.reduce((s, l) => s + l.payout, 0);
const gameOpen = (g) => gamePaid(g) === 0;

// derive: flat lines with player names, for the engine (settled games only,
// plus adjustment deltas — cash handoffs and shared expenses)
function tripLines() {
  const nameById = Object.fromEntries(state.players.map((p) => [p.id, p.name]));
  const out = [];
  for (const g of state.games) {
    if (gameOpen(g)) continue; // in-progress games don't affect balances yet
    for (const l of g.lines) {
      const name = nameById[l.player_id];
      if (name) out.push({ name, contribution: l.contribution, payout: l.payout });
    }
  }
  for (const a of state.adjustments) {
    for (const l of (a.lines || [])) {
      const name = nameById[l.player_id];
      if (!name || !l.delta) continue;
      // delta > 0: owed more at settlement (like a payout); delta < 0: owes more.
      out.push({ name, contribution: l.delta < 0 ? -l.delta : 0, payout: l.delta > 0 ? l.delta : 0 });
    }
  }
  return out;
}
function balances() { return netBalances(tripLines()); }

// ---------- actions ----------
async function createTrip(name, people = []) {
  // Trip names are unique, ignoring case ("Lake Weekend" == "lake weekend").
  const { data: existing } = await db.from('trips').select('name');
  if ((existing || []).some((t) => (t.name || '').trim().toLowerCase() === name.toLowerCase())) {
    toast('Trip "' + name + '" already exists');
    return;
  }
  const { data, error } = await db
    .from('trips').insert({ name }).select().single();
  if (error) { toast('Could not create trip'); return; }
  const names = people.map((s) => s.trim()).filter(Boolean);
  if (names.length) {
    await db.from('players').insert(names.map((nm) => ({ trip_id: data.id, name: nm })));
  }
  state.tripId = data.id;
  history.replaceState(null, '', location.pathname + '?t=' + data.id);
  await loadAll();
  subscribeRealtime(data.id);
}
async function addPlayer(name) {
  await db.from('players').insert({ trip_id: state.tripId, name });
  scheduleRefetch(); // instant feedback for this client; realtime updates the others
}
async function removePlayer(id) {
  await db.from('players').delete().eq('id', id);
  scheduleRefetch();
}
// Insert a player and return the created row (used for inline add in the game modal).
async function addPlayerReturning(name) {
  const { data, error } = await db.from('players')
    .insert({ trip_id: state.tripId, name }).select().single();
  scheduleRefetch();
  return error ? null : data;
}
async function saveGame({ id, name, buyin, played_at, lines }) {
  if (id) {
    await db.from('games').update({ name, buyin, played_at }).eq('id', id);
    await db.from('game_lines').delete().eq('game_id', id);
    await db.from('game_lines').insert(lines.map((l) => ({ ...l, game_id: id })));
  } else {
    const { data, error } = await db.from('games')
      .insert({ trip_id: state.tripId, name, buyin, played_at }).select().single();
    if (error) { toast('Could not save game'); return; }
    await db.from('game_lines').insert(lines.map((l) => ({ ...l, game_id: data.id })));
  }
  await rememberGameName(name); // custom names are retained for future games/trips
  scheduleRefetch();
}
async function deleteGame(id) {
  await db.from('games').delete().eq('id', id);
  scheduleRefetch();
}
// Permanently delete a trip for everyone (players/games/lines cascade in the DB).
async function deleteTrip(id) {
  await db.from('trips').delete().eq('id', id);
  forgetTrip(id);
}
// Adjustments: { kind: 'cash'|'expense', note, amount, lines: [{player_id, delta}] }
async function saveAdjustment({ id, kind, note, amount, lines }) {
  if (id) await db.from('adjustments').update({ kind, note, amount, lines }).eq('id', id);
  else await db.from('adjustments').insert({ trip_id: state.tripId, kind, note, amount, lines });
  scheduleRefetch();
}
async function deleteAdjustment(id) {
  await db.from('adjustments').delete().eq('id', id);
  scheduleRefetch();
}

// ---------- render ----------
const root = () => document.getElementById('root');
function render() {
  const r = root();
  r.innerHTML = '';
  if (state.loading) { r.append(el('div', { class: 'empty', text: 'Loading…' })); return; }
  if (!state.tripId || !state.trip) {
    r.append(state.homeView === 'history' ? renderHistory() : renderLanding());
    return;
  }
  r.append(renderHeader(), renderTabs(), renderBody());
}

      title: 'Remove', onclick: () => { people.splice(i, 1); drawChips(); } })));

  const buf = { v: '' };
  const addPerson = () => { const nm = buf.v.trim(); if (!nm) return; if (!people.includes(nm)) people.push(nm); buf.v = ''; personInp.value = ''; drawChips(); personInp.focus(); };
  const personInp = el('input', { class: 'inp', placeholder: 'Add a name…', oninput: (e) => (buf.v = e.target.value) });
  personInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') addPerson(); });
  card.append(el('div', { class: 'inline', style: 'margin-top:6px' }, [
    el('div', { class: 'grow', style: 'flex:1' }, [personInp]),
    el('button', { class: 'btn ghost small', text: 'Add', onclick: addPerson }),
  ]), chips);
  card.append(el('div', { class: 'muted', style: 'margin-top:6px', text: 'Optional now — you can add or remove people any time on the Players tab.' }));

  card.append(btn);

        el('button', { class: 'btn small', text: 'Open', onclick: () => openTrip(t.id) }),

    onclick: () => { state.homeView = 'history'; state.historyRaw = null; render(); } }));

// ---------- history (across all trips) ----------
async function loadHistory() {
  const [g, l, p, t] = await Promise.all([
    db.from('games').select('*'),
    db.from('game_lines').select('*'),
    db.from('players').select('*'),
    db.from('trips').select('*'),
  ]);
  state.historyRaw = { games: g.data || [], lines: l.data || [], players: p.data || [], trips: t.data || [] };
}

function renderHistory() {
  const wrap = el('div', { class: 'wrap' });
  wrap.append(el('div', { class: 'bar', style: 'margin:8px 0 4px' }, [
    el('button', { class: 'btn ghost small', text: '← Back', onclick: () => { state.homeView = 'home'; render(); } }),
    el('div', { class: 'grow', style: 'text-align:center' }, [el('h2', { text: 'History' })]),
    el('span', { style: 'display:inline-block;width:60px' }),
  ]));

  if (!state.historyRaw) {
    wrap.append(el('div', { class: 'empty', text: 'Loading…' }));
    loadHistory().then(() => { if (state.homeView === 'history') render(); });
    return wrap;
  }

  const { games, lines, players, trips } = state.historyRaw;
  if (!games.length) { wrap.append(el('div', { class: 'empty', text: 'No games recorded yet.' })); return wrap; }

  const pname = Object.fromEntries(players.map((p) => [p.id, p.name]));
  const tripById = Object.fromEntries((trips || []).map((t) => [t.id, t]));
  const linesByGame = {};
  for (const l of lines) (linesByGame[l.game_id] || (linesByGame[l.game_id] = [])).push(l);

  // Finished games only — in-progress games have no result yet and adjustments
  // (transfers/expenses) are not gambling outcomes, so neither is counted here.
  const finished = games.filter((g) => (linesByGame[g.id] || []).some((l) => l.payout > 0));

  let total = 0;
  const byYear = {}, byGame = {}, byPerson = {}, byTrip = {};
  // gameNets: per finished game, [{name, net}] — feeds leaderboard/head-to-head/records
  const gameNets = [];
  for (const g of finished) {
    const ls = linesByGame[g.id] || [];
    const nets = [];
    let moved = 0, pot = 0;
    for (const l of ls) {
      const net = l.payout - l.contribution;
      pot += l.contribution;
      if (net > 0) moved += net;                 // money that changed hands this game
      const nm = pname[l.player_id];
      if (!nm) continue;
      byPerson[nm] = (byPerson[nm] || 0) + net;
      nets.push({ name: nm, net, contribution: l.contribution });
    }
    gameNets.push({ gname: g.name, when: g.played_at, pot, lines: nets });
    total += moved;
    const yr = new Date(g.played_at).getFullYear();
    byYear[yr] = (byYear[yr] || 0) + moved;
    byGame[g.name] = (byGame[g.name] || 0) + moved;
    const bt = byTrip[g.trip_id] || (byTrip[g.trip_id] = { moved: 0, games: 0 });
    bt.moved += moved; bt.games += 1;
  }

  wrap.append(el('div', { class: 'card', style: 'text-align:center;border-top:4px solid var(--accent)' }, [
    el('div', { class: 'muted', text: 'Total money that changed hands (all time)' }),
    el('div', { class: 'money', style: 'font-size:30px;margin-top:4px', text: money(total) }),
    el('div', { class: 'muted', style: 'margin-top:4px', text: finished.length + ' games · ' + Object.keys(byTrip).length + ' trip(s) · ' + Object.keys(byYear).length + ' year(s)' }),
  ]));

  // ---- Leaderboard (per person: played, wins, win %, biggest win, lifetime net)
  const stats = {};
  for (const g of gameNets) {
    for (const l of g.lines) {
      const s = stats[l.name] || (stats[l.name] = { played: 0, wins: 0, net: 0, biggest: 0, maxStake: 0, streak: 0, bestStreak: 0 });
      s.played += 1;
      s.net += l.net;
      if (l.net > 0) s.wins += 1;
      if (l.net > s.biggest) s.biggest = l.net;
      if (l.contribution > s.maxStake) s.maxStake = l.contribution;
    }
  }
  // win streaks: walk games in time order
  for (const g of [...gameNets].sort((a, b) => (a.when < b.when ? -1 : 1))) {
    for (const l of g.lines) {
      const s = stats[l.name];
      s.streak = l.net > 0 ? s.streak + 1 : 0;
      if (s.streak > s.bestStreak) s.bestStreak = s.streak;
    }
  }
  wrap.append(el('div', { class: 'section-h', style: 'margin-top:18px', text: 'Leaderboard' }));
  Object.entries(stats).sort((a, b) => b[1].net - a[1].net).forEach(([nm, s], i) => {
    const medal = ['🥇', '🥈', '🥉'][i] || '';
    wrap.append(el('div', { class: 'row-item' }, [
      el('div', { class: 'grow' }, [
        el('div', { class: 'title', text: nm }),
        el('div', { class: 'muted', text: (medal ? medal + ' ' : '') + s.wins + '–' + (s.played - s.wins) +
          ' · ' + Math.round((s.wins / s.played) * 100) + '% wins · biggest ' + signed(s.biggest) }),
      ]),
      el('div', { class: s.net > 0 ? 'pos' : s.net < 0 ? 'neg' : 'zero', text: signed(s.net) }),
    ]));
  });

  // ---- Head-to-head (who owns whom, losses attributed pro-rata to winners)
  const flows = pairwiseFlows(gameNets.map((g) => g.lines));
  wrap.append(el('div', { class: 'section-h', style: 'margin-top:18px', text: 'Head-to-head' }));
  if (!flows.length) wrap.append(el('div', { class: 'muted', text: 'No finished games yet.' }));
  flows.slice(0, 15).forEach((f) => {
    wrap.append(el('div', { class: 'row-item' }, [
      el('div', { class: 'grow title', text: f.to + ' over ' + f.from }),
      el('div', { class: 'money', text: money(f.amount) }),
    ]));
  });
  if (flows.length > 15) wrap.append(el('div', { class: 'muted', style: 'margin-top:6px;text-align:center', text: '+ ' + (flows.length - 15) + ' more pairs' }));

  // ---- Records
  wrap.append(el('div', { class: 'section-h', style: 'margin-top:18px', text: 'Records' }));
  if (gameNets.length) {
    const biggestPot = gameNets.reduce((a, b) => (b.pot > a.pot ? b : a));
    let bigWin = { name: '—', net: 0, gname: '' };
    for (const g of gameNets) for (const l of g.lines) if (l.net > bigWin.net) bigWin = { name: l.name, net: l.net, gname: g.gname };
    const streakKing = Object.entries(stats).reduce((a, b) => (b[1].bestStreak > a[1].bestStreak ? b : a));
    const stakeKing = Object.entries(stats).reduce((a, b) => (b[1].maxStake > a[1].maxStake ? b : a));
    const rec = (label, val) => wrap.append(el('div', { class: 'row-item' }, [
      el('div', { class: 'grow muted', text: label }),
      el('div', { class: 'money', text: val }),
    ]));
    rec('Biggest pot — ' + biggestPot.gname, money(biggestPot.pot));
    rec('Biggest single win — ' + bigWin.name + ' · ' + bigWin.gname, signed(bigWin.net));
    rec('Longest win streak — ' + streakKing[0], streakKing[1].bestStreak + ' game' + (streakKing[1].bestStreak === 1 ? '' : 's'));
    rec('Largest single stake — ' + stakeKing[0], money(stakeKing[1].maxStake));
  } else {
    wrap.append(el('div', { class: 'muted', text: 'No finished games yet.' }));
  }

  // ---- Player profiles (lifetime net by game type; tap to expand)
  const profile = {}; // name -> { gname: net }
  for (const g of gameNets) for (const l of g.lines) {
    (profile[l.name] || (profile[l.name] = {}))[g.gname] = ((profile[l.name] || {})[g.gname] || 0) + l.net;
  }
  wrap.append(el('div', { class: 'section-h', style: 'margin-top:18px', text: 'Player profiles — best & worst games' }));
  for (const [nm, perGame] of Object.entries(profile).sort((a, b) => a[0] < b[0] ? -1 : 1)) {
    const entries = Object.entries(perGame).sort((a, b) => b[1] - a[1]);
    const best = entries[0];
    const worst = entries[entries.length - 1];
    const open = expandedProfiles.has(nm);
    const row = el('div', { class: 'row-item', style: 'flex-wrap:wrap', onclick: () => {
      if (expandedProfiles.has(nm)) expandedProfiles.delete(nm); else expandedProfiles.add(nm);
      render();
    } }, [
      el('div', { class: 'grow' }, [
        el('div', { class: 'title', text: (open ? '▾ ' : '▸ ') + nm }),
        el('div', { class: 'muted', text: 'Best: ' + best[0] + ' ' + signed(best[1]) +
          (worst[0] !== best[0] ? ' · Worst: ' + worst[0] + ' ' + signed(worst[1]) : '') }),
      ]),
    ]);
    if (open) {
      const detail = el('div', { style: 'width:100%;margin-top:8px' });
      for (const [gn, v] of entries) {
        detail.append(el('div', { class: 'inline', style: 'justify-content:space-between;padding:3px 0' }, [
          el('span', { class: 'muted', text: gn }),
          el('span', { class: v > 0 ? 'pos' : v < 0 ? 'neg' : 'zero', style: 'font-size:13px', text: signed(v) }),
        ]));
      }
      row.append(detail);
    }
    wrap.append(row);
  }

  const section = (title, rows) => {
    wrap.append(el('div', { class: 'section-h', style: 'margin-top:18px', text: title }));
    if (!rows.length) { wrap.append(el('div', { class: 'muted', text: 'None yet.' })); return; }
    for (const [label, val, cls] of rows) {
      wrap.append(el('div', { class: 'row-item' }, [
        el('div', { class: 'grow title', text: label }),
        el('div', { class: cls || 'money', text: val }),
      ]));
    }
  };

  // By trip — tap to open that trip.
  wrap.append(el('div', { class: 'section-h', style: 'margin-top:18px', text: 'By trip' }));
  Object.entries(byTrip)
    .map(([tid, v]) => ({ tid, ...v, t: tripById[tid] }))
    .sort((a, b) => b.moved - a.moved)
    .forEach((r) => {
      wrap.append(el('div', { class: 'row-item', style: 'cursor:pointer', onclick: () => openTrip(r.tid) }, [
        el('div', { class: 'grow' }, [
          el('div', { class: 'title', text: r.t ? r.t.name : 'Trip' }),
          el('div', { class: 'muted', text: r.games + ' game' + (r.games === 1 ? '' : 's') + (r.t ? ' · ' + new Date(r.t.date || r.t.created_at).toLocaleDateString() : '') }),
        ]),
        el('div', { class: 'money', text: money(r.moved) }),
      ]));
    });

  section('By year', Object.entries(byYear).sort((a, b) => b[0] - a[0]).map(([y, v]) => [String(y), money(v)]));
  section('By game', Object.entries(byGame).sort((a, b) => b[1] - a[1]).map(([g, v]) => [g, money(v)]));

  return wrap;
}
const expandedProfiles = new Set();

      el('h1', { text: '🐻 ' + state.trip.name }),
      el('div', { class: 'sub', text: 'Code ' + (state.trip.code || '—') + ' · ' + state.players.length + ' players' }),
    ]),
    el('button', { class: 'btn small', title: 'Add game', text: '＋', disabled: state.players.length ? null : 'true',
      style: 'font-size:16px;font-weight:800;padding:7px 13px', onclick: () => openGameModal(null) }),
    el('button', { class: 'btn small', text: 'Share', onclick: async () => {
      try {
        if (navigator.share) await navigator.share({ title: 'The Ledger — ' + state.trip.name, url: shareUrl });
        else { await navigator.clipboard.writeText(shareUrl); toast('Link copied'); }
      } catch (_) { try { await navigator.clipboard.writeText(shareUrl); toast('Link copied'); } catch (__) {} }
    } }),
    el('button', { class: 'btn small', title: 'Delete trip', text: '✕ Delete Trip',
      style: 'background:transparent;border:1px solid var(--neg);color:var(--neg)',
      onclick: async () => {
        if (confirm('Delete "' + state.trip.name + '" for EVERYONE? All of its games and tallies are permanently deleted. This cannot be undone.')) {

}

function renderTabs() {

  else if (state.tab === 'games') wrap.append(renderGames());
  else if (state.tab === 'tally') wrap.append(renderTally());
  else if (state.tab === 'settle') wrap.append(renderSettle());

function renderPlayers() {
  const box = el('div', {});
  let name = '';
  const inp = el('input', { class: 'inp', placeholder: 'Add a person…', oninput: (e) => (name = e.target.value) });
  const add = () => { const n = name.trim(); if (!n) return; addPlayer(n); inp.value = ''; name = ''; inp.focus(); };
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
  box.append(el('div', { class: 'card' }, [
    el('div', { class: 'inline' }, [
      el('div', { class: 'grow', style: 'flex:1' }, [inp]),
      el('button', { class: 'btn', text: 'Add', onclick: add }),
    ]),
  ]));
  if (!state.players.length) box.append(el('div', { class: 'empty', text: 'Add everyone on the trip.' }));
  for (const p of state.players) {
    box.append(el('div', { class: 'row-item' }, [
      el('div', { class: 'grow title', text: p.name }),
      el('button', { class: 'iconbtn', html: '🗑', onclick: () => { if (confirm('Remove ' + p.name + '? This also removes them from all games.')) removePlayer(p.id); } }),
    ]));

function renderGames() {
  const box = el('div', {});
  if (!state.players.length) { box.append(el('div', { class: 'empty', text: 'Add players first (Players tab).' })); return box; }

  box.append(el('button', { class: 'btn ghost block', style: 'margin-top:12px', text: '💵 Log cash handoff / shared expense',
    onclick: () => {
      if (!state.adjustmentsAvailable) { toast('Needs the database update — see README (0002_adjustments.sql)'); return; }
      openAdjModal(null);
    } }));

  if (!state.games.length && !state.adjustments.length) {
    box.append(el('div', { class: 'empty', html: '<div class="big">🎲</div>No games yet.<br>Tap ＋ in the top bar to log the first one.' }));
  }

  const nameById = Object.fromEntries(state.players.map((p) => [p.id, p.name]));

  // Games and adjustments interleaved chronologically, newest first.
  const items = [
    ...state.games.map((g) => ({ when: g.played_at, game: g })),
    ...state.adjustments.map((a) => ({ when: a.created_at, adj: a })),
  ].sort((x, y) => (x.when < y.when ? 1 : -1));

  for (const item of items) {
    if (item.game) {
      const g = item.game;
      const pot = g.lines.reduce((s, l) => s + l.contribution, 0);
      const paid = g.lines.reduce((s, l) => s + l.payout, 0);
      const winner = g.lines.filter((l) => l.payout - l.contribution > 0)
        .sort((a, b) => (b.payout - b.contribution) - (a.payout - a.contribution))[0];
      const meta = [fmtTime(g.played_at), g.lines.length + ' players'];
      if (paid === 0) meta.push('⏳ in progress');
      else if (winner) meta.push('👑 ' + (nameById[winner.player_id] || '?'));
      if (paid !== 0 && pot !== paid) meta.push('⚠︎ unbalanced');
      box.append(el('div', { class: 'row-item', onclick: () => openGameModal(g) }, [
        el('div', { class: 'grow' }, [
          el('div', { class: 'title', text: g.name }),
          el('div', { class: 'muted', text: meta.join('  ·  ') }),
        ]),
        el('div', { class: 'money', text: money(pot) }),
      ]));
    } else {
      const a = item.adj;
      box.append(el('div', { class: 'row-item', onclick: () => openAdjModal(a) }, [
        el('div', { class: 'grow' }, [
          el('div', { class: 'title', text: '💵 ' + adjSummary(a, nameById) }),
          el('div', { class: 'muted', text: fmtTime(a.created_at) + (a.note ? '  ·  ' + a.note : '') }),
        ]),
        el('div', { class: 'money', text: money(a.amount || 0) }),
      ]));
    }
  }
  return box;
}

// One-line description of an adjustment, e.g. "Ryan → Dugan · cash" or "Bill fronted ÷ 4".
function adjSummary(a, nameById) {
  const lines = a.lines || [];
  const payer = lines.find((l) => l.delta > 0);
  if (a.kind === 'cash') {
    const recv = lines.find((l) => l.delta < 0);
    return (nameById[payer?.player_id] || '?') + ' → ' + (nameById[recv?.player_id] || '?') + ' · cash';
  }
  const owers = lines.filter((l) => l.delta < 0).length;
  return (nameById[payer?.player_id] || '?') + ' fronted · split ÷ ' + (owers + 1);
}

function renderTally() {
  const box = el('div', {});
  if (!state.players.length) { box.append(el('div', { class: 'empty', text: 'Add players to see the tally.' })); return box; }
  const b = balances();
  const rows = state.players.map((p) => ({ name: p.name, net: b[p.name] ?? 0 }))
    .sort((x, y) => (y.net - x.net) || (x.name < y.name ? -1 : 1));
  for (const r of rows) {
    const cls = r.net > 0 ? 'pos' : r.net < 0 ? 'neg' : 'zero';
    box.append(el('div', { class: 'row-item' }, [
      el('div', { class: 'grow title', text: r.name }),
      el('div', { class: cls, text: signed(r.net) }),
    ]));
  }
  box.append(el('div', { class: 'muted', style: 'margin-top:12px;text-align:center', text: 'Positive = they are owed.  Negative = they owe.' }));
  return box;
}

function renderSettle() {
  const box = el('div', {});
  const openCount = state.games.filter(gameOpen).length;
  const noteOpen = () => { if (openCount) box.append(el('div', { class: 'card', style: 'border-color:var(--gold)' }, [
    el('div', { class: 'muted', text: '⏳ ' + openCount + ' game' + (openCount === 1 ? '' : 's') + ' in progress — not counted until you set the winner.' }),
  ])); };
  if (!state.games.length && !state.adjustments.length) { box.append(el('div', { class: 'empty', text: 'No games yet — nothing to settle.' })); return box; }
  const b = balances();
  const payments = minimize(b);
  const res = residual(b);
  if (!payments.length) {
    noteOpen();
    box.append(el('div', { class: 'empty', html: '<div class="big">✅</div><b>All square</b><br>Everyone is even — no payments needed.' }));
    appendStatementsAndExport(box, b, payments);
    return box;
  }
  noteOpen();
  if (res !== 0) {
    box.append(el('div', { class: 'card', style: 'border-color:var(--accent)' }, [
      el('div', { class: 'neg', text: '⚠︎ A game pot is unbalanced (off by ' + money(Math.abs(res)) + '). Fix it in Games for an exact settlement.' }),
    ]));
  }
  box.append(el('div', { class: 'muted', style: 'margin-top:12px', text: payments.length + ' payment' + (payments.length === 1 ? '' : 's') + ' to settle everyone:' }));
  for (const p of payments) {
    box.append(el('div', { class: 'row-item' }, [
      el('div', { class: 'grow', html: '<b>' + escapeHtml(p.from) + '</b> &rarr; <b>' + escapeHtml(p.to) + '</b>' }),
      el('div', { class: 'money', text: money(p.amount) }),
    ]));
  }
  appendStatementsAndExport(box, b, payments);
  return box;
}

// ---------- statements + export ----------

async function copyText(text, doneMsg) {
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
  } catch (_) { /* fall through to clipboard */ }
  try { await navigator.clipboard.writeText(text); toast(doneMsg); }
  catch (_) { toast('Could not copy'); }
}

function settlementText(payments) {
  const head = '🐻 The Ledger — ' + state.trip.name + '\n';
  if (!payments.length) return head + 'All square — no payments needed.';
  return head + 'Settle up (' + payments.length + ' payment' + (payments.length === 1 ? '' : 's') + '):\n' +
    payments.map((p) => p.from + ' → ' + p.to + ': ' + money(p.amount)).join('\n');
}

// Per-player statement: every finished game they played, adjustments, total, settlement role.
function playerStatement(name, bals, payments) {
  const nameById = Object.fromEntries(state.players.map((p) => [p.id, p.name]));
  const rows = [];
  const chronGames = [...state.games].sort((a, b) => (a.played_at < b.played_at ? -1 : 1));
  for (const g of chronGames) {
    const line = g.lines.find((l) => nameById[l.player_id] === name);
    if (!line) continue;
    if (gameOpen(g)) rows.push({ label: g.name + ' (' + fmtTime(g.played_at) + ')', text: 'in progress' });
    else rows.push({ label: g.name + ' (' + fmtTime(g.played_at) + ')', net: line.payout - line.contribution });
  }
  for (const a of state.adjustments) {
    const line = (a.lines || []).find((l) => nameById[l.player_id] === name);
    if (!line || !line.delta) continue;
    rows.push({ label: '💵 ' + adjSummary(a, nameById) + (a.note ? ' — ' + a.note : ''), net: line.delta });
  }
  const total = bals[name] ?? 0;
  const pays = payments.filter((p) => p.from === name);
  const gets = payments.filter((p) => p.to === name);
  let settle;
  if (pays.length) settle = 'Pays: ' + pays.map((p) => p.to + ' ' + money(p.amount)).join(', ');
  else if (gets.length) settle = 'Collects: ' + gets.map((p) => p.from + ' ' + money(p.amount)).join(', ');
  else settle = 'All square';
  return { rows, total, settle };
}

function statementText(name, st) {
  return name + ' — ' + state.trip.name + '\n' +
    st.rows.map((r) => r.label + ': ' + (r.net != null ? signed(r.net) : r.text)).join('\n') +
    '\nTotal: ' + signed(st.total) + '\n' + st.settle;
}

// Full journal CSV: one row per game line and adjustment line.
function journalCsv() {
  const nameById = Object.fromEntries(state.players.map((p) => [p.id, p.name]));
  const esc = (v) => '"' + String(v).replaceAll('"', '""') + '"';
  const rows = [['type', 'name', 'time', 'player', 'in', 'out', 'net']];
  for (const g of [...state.games].sort((a, b) => (a.played_at < b.played_at ? -1 : 1))) {
    for (const l of g.lines) {
      rows.push(['game', g.name, g.played_at, nameById[l.player_id] || '?', l.contribution, l.payout, l.payout - l.contribution]);
    }
  }
  for (const a of state.adjustments) {
    for (const l of (a.lines || [])) {
      rows.push([a.kind, a.note || adjSummary(a, nameById), a.created_at, nameById[l.player_id] || '?',
        l.delta < 0 ? -l.delta : 0, l.delta > 0 ? l.delta : 0, l.delta]);
    }
  }
  return rows.map((r) => r.map(esc).join(',')).join('\n');
}

function downloadCsv() {
  const blob = new Blob([journalCsv()], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: 'the-ledger-' + state.trip.name.replace(/[^\w-]+/g, '_') + '.csv' });
  document.body.append(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 500);
}

const expandedStmts = new Set();

function appendStatementsAndExport(box, bals, payments) {
  box.append(el('div', { class: 'inline', style: 'margin-top:16px' }, [
    el('button', { class: 'btn ghost small', style: 'flex:1', text: '📋 Copy settlement',
      onclick: () => copyText(settlementText(payments), 'Settlement copied') }),
    el('button', { class: 'btn ghost small', style: 'flex:1', text: '⬇️ Download CSV', onclick: downloadCsv }),
  ]));

  box.append(el('div', { class: 'section-h', style: 'margin-top:18px', text: 'Statements' }));
  for (const p of state.players) {
    const st = playerStatement(p.name, bals, payments);
    const open = expandedStmts.has(p.name);
    const row = el('div', { class: 'row-item', style: 'flex-wrap:wrap', onclick: () => {
      if (expandedStmts.has(p.name)) expandedStmts.delete(p.name); else expandedStmts.add(p.name);
      render();
    } }, [
      el('div', { class: 'grow title', text: (open ? '▾ ' : '▸ ') + p.name }),
      el('div', { class: st.total > 0 ? 'pos' : st.total < 0 ? 'neg' : 'zero', text: signed(st.total) }),
    ]);
    if (open) {
      const detail = el('div', { style: 'width:100%;margin-top:8px' });
      for (const r of st.rows) {
        detail.append(el('div', { class: 'inline', style: 'justify-content:space-between;padding:3px 0' }, [
          el('span', { class: 'muted', text: r.label }),
          r.net != null
            ? el('span', { class: r.net > 0 ? 'pos' : r.net < 0 ? 'neg' : 'zero', style: 'font-size:13px', text: signed(r.net) })
            : el('span', { class: 'muted', text: r.text }),
        ]));
      }
      detail.append(el('div', { class: 'muted', style: 'margin-top:6px', text: st.settle }));
      detail.append(el('button', { class: 'btn ghost small', style: 'margin-top:8px', text: '📋 Copy statement',
        onclick: (e) => { e.stopPropagation(); copyText(statementText(p.name, st), 'Statement copied'); } }));
      row.append(detail);
    }
    box.append(row);
  }
}
function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---------- adjustment modal (cash handoff / shared expense) ----------
function openAdjModal(adj) {
  const editing = !!adj;
  let kind = adj ? adj.kind : 'cash';
  let amount = adj ? (adj.amount || 0) : 0;
  let note = adj ? (adj.note || '') : '';
  let payerId = null;
  let recvId = null;
  let sharers = new Set(state.players.map((p) => p.id)); // expense default: everyone
  if (adj) {
    const pos = (adj.lines || []).find((l) => l.delta > 0);
    payerId = pos ? pos.player_id : null;
    if (kind === 'cash') {
      const neg = (adj.lines || []).find((l) => l.delta < 0);
      recvId = neg ? neg.player_id : null;
    } else {
      sharers = new Set((adj.lines || []).filter((l) => l.delta < 0).map((l) => l.player_id));
      if (payerId) sharers.add(payerId);
    }
  }

  const isDirty = () => amount > 0 || !!payerId || !!note.trim();
  const bg = el('div', { class: 'modal-bg', onclick: (e) => {
    if (e.target !== bg) return;
    if (!isDirty() || confirm('Discard this entry? Your input will be lost.')) bg.remove();
  } });
  const modal = el('div', { class: 'modal' });
  bg.append(modal);
  document.body.append(bg);

  function rebuild() { modal.innerHTML = ''; build(); }

  function pickList(title, isSel, onPick) {
    modal.append(el('div', { class: 'section-h', text: title }));
    for (const p of state.players) {
      const sel = isSel(p.id);
      modal.append(el('div', { class: 'check' + (sel ? ' sel' : ''), onclick: () => onPick(p.id) }, [
        el('div', { class: 'box' }),
        el('div', { class: 'grow title', text: p.name }),
      ]));
    }
  }

  function build() {
    modal.append(el('div', { class: 'bar' }, [
      el('button', { class: 'btn ghost small', text: 'Cancel', onclick: () => bg.remove() }),
      el('div', { class: 'grow', style: 'text-align:center' }, [el('h2', { text: editing ? 'Edit entry' : 'Cash / expense' })]),
      el('button', { class: 'btn small', text: 'Save', onclick: onSave }),
    ]));

    // kind toggle
    const seg = el('div', { class: 'inline', style: 'margin-top:12px' });
    for (const [k, label] of [['cash', '💵 Cash handoff'], ['expense', '🧾 Shared expense']]) {
      seg.append(el('button', { class: 'btn small ' + (kind === k ? '' : 'ghost'), style: 'flex:1',
        text: label, onclick: () => { kind = k; rebuild(); } }));
    }
    modal.append(seg);

    const ctl = moneyControl(amount, (v) => (amount = v));
    modal.append(el('label', { class: 'field', text: 'Amount' }),
      el('div', { class: 'inline', style: 'margin-top:6px;flex-wrap:wrap' }, [
        el('div', { class: 'grow muted', style: 'flex:1', text: 'Slide ($5 fast, $1 slow) or type' }),
        ctl.num,
        ctl.range,
      ]));

    if (kind === 'cash') {
      pickList('Who paid (hands over the cash)', (id) => payerId === id, (id) => { payerId = id; if (recvId === id) recvId = null; rebuild(); });
      pickList('Who received it', (id) => recvId === id, (id) => { recvId = id; if (payerId === id) payerId = null; rebuild(); });
      modal.append(el('div', { class: 'muted', style: 'margin-top:8px', text: 'The payer is owed this back at settlement (an early payment or a loan).' }));
    } else {
      pickList('Who fronted the money', (id) => payerId === id, (id) => { payerId = id; sharers.add(id); rebuild(); });
      pickList('Who splits it (tap to toggle)', (id) => sharers.has(id), (id) => {
        if (sharers.has(id) && id !== payerId) sharers.delete(id); else sharers.add(id);
        rebuild();
      });
      modal.append(el('div', { class: 'muted', style: 'margin-top:8px', text: 'Split evenly; odd dollars are eaten by the payer.' }));
    }

    const noteInp = el('input', { class: 'inp', value: note, placeholder: 'Note (e.g. pizza)', oninput: (e) => (note = e.target.value) });
    modal.append(el('label', { class: 'field', text: 'Note (optional)' }), noteInp);

    if (editing) {
      modal.append(el('button', { class: 'btn ghost block', style: 'margin-top:18px;color:var(--neg)', text: 'Delete entry',
        onclick: () => { if (confirm('Delete this entry?')) { deleteAdjustment(adj.id); bg.remove(); } } }));
    }
  }

  function onSave() {
    if (amount <= 0) { toast('Enter an amount'); return; }
    if (!payerId) { toast('Pick who paid'); return; }
    let lines;
    if (kind === 'cash') {
      if (!recvId) { toast('Pick who received it'); return; }
      lines = [
        { player_id: payerId, delta: amount },
        { player_id: recvId, delta: -amount },
      ];
    } else {
      const others = [...sharers].filter((id) => id !== payerId);
      if (!others.length) { toast('Pick at least one other person to split with'); return; }
      const n = sharers.has(payerId) ? others.length + 1 : others.length;
      const base = Math.floor(amount / n);
      lines = others.map((id) => ({ player_id: id, delta: -base }));
      lines.push({ player_id: payerId, delta: base * others.length });
    }
    saveAdjustment({ id: adj ? adj.id : null, kind, note: note.trim(), amount, lines });
    bg.remove();
  }

  build();
}

// ---------- game modal ----------
function openGameModal(game) {
  const editing = !!game;
  let name = game ? game.name : '';
  // Dropdown selection: a preset name, '' (none yet), or '__other__' (custom text).
  let nameChoice = game ? (isKnownGame(game.name) ? game.name : '__other__') : '';
  // Default stake for newly selected players: last edited amount in this game,
  // seeded from the most recent game's buy-in (buy-ins often repeat).
  let stake = game ? game.buyin : (state.games.length ? state.games[0].buyin : 0);
  let when = game ? new Date(game.played_at) : new Date();
  const selected = new Set(game ? game.lines.map((l) => l.player_id) : []);
  const contribs = {}; // player_id -> total contribution (buy-in + rebuys)
  const payouts = {};  // player_id -> payout
  let winnerId = null;
  let manual = false;
  if (game) {
    for (const l of game.lines) { payouts[l.player_id] = l.payout; contribs[l.player_id] = l.contribution; }
    const winners = game.lines.filter((l) => l.payout > 0);
    winnerId = winners.length === 1 ? winners[0].player_id : null;
    manual = winners.length > 1; // multiple winners => split view; else winner-takes-all view
  }

  // Clicking outside the sheet must never silently discard entries: if anything
  // has been entered, ask first; an untouched modal just closes.
  const isDirty = () => !!name.trim() || selected.size > 0;
  const bg = el('div', { class: 'modal-bg', onclick: (e) => {
    if (e.target !== bg) return;
    if (!isDirty() || confirm('Discard this game? Your entries will be lost.')) bg.remove();
  } });
  const modal = el('div', { class: 'modal' });
  bg.append(modal);
  document.body.append(bg);

  // Payout preset state: while pendingPcts is set, tapping payout rows assigns
  // finishing places and fills amounts from presetSplit().
  let pendingPcts = null;
  let presetLabel = null;
  let placeOrder = [];

  const contribOf = (id) => (contribs[id] != null ? contribs[id] : stake);
  // Set a player's buy-in; the last edited amount becomes the default for newly
  // selected players. The money control manages its own display, so no rebuild.
  function setAmt(pid, v) {
    contribs[pid] = Math.max(0, Math.round(v || 0));
    stake = contribs[pid];
    updateTotals();
  }
  const selPlayers = () => state.players.filter((p) => selected.has(p.id));
  const pot = () => selPlayers().reduce((s, p) => s + contribOf(p.id), 0);
  const totalPayout = () => selPlayers().reduce((s, p) => s + (payouts[p.id] || 0), 0);

  function seedManual() {
    for (const p of selPlayers()) if (payouts[p.id] == null) payouts[p.id] = p.id === winnerId ? pot() : 0;
  }
  function rebuild() { modal.innerHTML = ''; build(); }

  const isInProgress = () => (manual ? totalPayout() === 0 : !winnerId);

  function build() {
    // top bar
    modal.append(el('div', { class: 'bar' }, [
      el('button', { class: 'btn ghost small', text: 'Cancel', onclick: () => bg.remove() }),
      el('div', { class: 'grow', style: 'text-align:center' }, [el('h2', { text: editing ? 'Edit game' : 'New game' })]),
      el('button', { class: 'btn small', text: selected.size >= 2 && isInProgress() ? 'Save (open)' : 'Save', onclick: onSave }),
    ]));

    // fields — game name: dropdown of common games + a custom "Other…" option
    const nameSel = el('select', { class: 'inp' });
    nameSel.append(el('option', { value: '', text: 'Select a game…' }));
    for (const g of allGameNames()) nameSel.append(el('option', { value: g, text: g }));
    nameSel.append(el('option', { value: '__other__', text: 'Other (type a name)…' }));
    nameSel.value = nameChoice;
    nameSel.addEventListener('change', (e) => {
      nameChoice = e.target.value;
      name = nameChoice === '__other__' ? (isKnownGame(name) ? '' : name) : nameChoice;
      rebuild();
    });
    modal.append(el('label', { class: 'field', text: 'Game' }), nameSel);
    if (nameChoice === '__other__') {
      const customInp = el('input', { class: 'inp', style: 'margin-top:8px', value: isKnownGame(name) ? '' : name,
        placeholder: 'Game name', oninput: (e) => (name = e.target.value) });
      modal.append(customInp);
    }

    const dt = el('input', { class: 'inp', type: 'datetime-local', value: toLocalInput(when),
      oninput: (e) => { const d = new Date(e.target.value); if (!isNaN(d)) when = d; } });
    modal.append(el('label', { class: 'field', text: 'Time' }), dt);

    // participants — each selected player carries their own buy-in amount
    modal.append(el('div', { class: 'section-h potline', text: 'Who played · pot ' + money(pot()) }));
    for (const p of state.players) {
      const sel = selected.has(p.id);
      const toggle = () => {
        if (selected.has(p.id)) { selected.delete(p.id); delete payouts[p.id]; delete contribs[p.id]; if (winnerId === p.id) winnerId = null; }
        else { selected.add(p.id); contribs[p.id] = stake; } // new players start at the last-used amount
        if (manual) seedManual();
        rebuild();
      };
      const row = el('div', { class: 'check' + (sel ? ' sel' : '') }, [
        el('div', { class: 'box', onclick: toggle }),
        el('div', { class: 'grow title', text: p.name, style: 'cursor:pointer', onclick: toggle }),
      ]);
      if (sel) {
        row.style.flexWrap = 'wrap';
        const ctl = moneyControl(contribOf(p.id), (v) => setAmt(p.id, v), 'buyamt', p.id);
        row.append(ctl.num, ctl.range);
      }
      modal.append(row);
    }
    if (selected.size) modal.append(el('div', { class: 'muted', style: 'margin-top:6px', text: 'Slide for $5 steps — drag slowly for $1 — or type an exact amount. Rebuy = raise that player\'s total.' }));
    // Inline add-player (so you can build the roster right here if nobody's added yet)
    const addBuf = { v: '' };
    const doAddPlayer = async () => {
      const nm = addBuf.v.trim(); if (!nm) return;
      const p = await addPlayerReturning(nm);
      if (p) {
        if (!state.players.some((x) => x.id === p.id)) state.players.push(p);
        state.players.sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
        selected.add(p.id);
        if (manual) seedManual();
        rebuild();
      }
    };
    const addInp = el('input', { class: 'inp', placeholder: state.players.length ? 'Add another player…' : 'Add a player…',
      oninput: (e) => (addBuf.v = e.target.value) });
    addInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') doAddPlayer(); });
    modal.append(el('div', { class: 'inline', style: 'margin-top:8px' }, [
      el('div', { class: 'grow', style: 'flex:1' }, [addInp]),
      el('button', { class: 'btn ghost small', text: 'Add', onclick: doAddPlayer }),
    ]));

    if (selected.size >= 2) {
      if (!manual) {
        modal.append(el('div', { class: 'section-h', text: 'Winner — takes the whole pot' }));
        for (const p of selPlayers()) {
          const isW = winnerId === p.id;
          let netEl;
          if (winnerId) {
            const net = isW ? pot() - contribOf(p.id) : -contribOf(p.id);
            netEl = el('div', { class: net > 0 ? 'pos' : net < 0 ? 'neg' : 'zero', 'data-npid': p.id, text: signed(net) });
          } else {
            netEl = el('div', { class: 'muted', 'data-npid': p.id, text: 'in for ' + money(contribOf(p.id)) });
          }
          modal.append(el('div', { class: 'check' + (isW ? ' sel' : ''), onclick: () => { winnerId = isW ? null : p.id; rebuild(); } }, [
            el('div', { class: 'grow' }, [ el('span', { class: isW ? 'crown' : '', text: (isW ? '👑 ' : '') + p.name }) ]),
            netEl,
          ]));
        }
        if (!winnerId) modal.append(el('div', { class: 'muted', style: 'margin-top:6px', text: "No winner yet? Just tap Save — the game stays open and won't affect Settle Up until you set the result." }));
      } else {
        modal.append(el('div', { class: 'section-h', text: 'Payouts' }));

        // Preset chips: one-tap payout structures
        const chipRow = el('div', { class: 'inline', style: 'flex-wrap:wrap;gap:6px;margin-top:4px' });
        const PRESETS = [['70/30', [70, 30]], ['70/20/10', [70, 20, 10]], ['50/50 chop', [50, 50]], ['Custom %', null]];
        for (const [label, pcts] of PRESETS) {
          const active = presetLabel === label;
          chipRow.append(el('button', { class: 'btn small ' + (active ? '' : 'ghost'), text: label, onclick: () => {
            if (active) { pendingPcts = null; presetLabel = null; placeOrder = []; rebuild(); return; }
            let chosen = pcts;
            if (!chosen) {
              const raw = prompt('Percentages, comma-separated (must sum to 100):', '60,30,10');
              if (!raw) return;
              chosen = raw.split(',').map((s) => parseInt(s.trim(), 10));
              if (chosen.some(isNaN) || chosen.reduce((a, b) => a + b, 0) !== 100) { toast('Percentages must sum to 100'); return; }
            }
            if (chosen.length > selected.size) { toast('More places than players'); return; }
            pendingPcts = chosen; presetLabel = label; placeOrder = [];
            for (const p of selPlayers()) payouts[p.id] = 0;
            rebuild();
          } }));
        }
        modal.append(chipRow);
        if (pendingPcts) {
          modal.append(el('div', { class: 'muted', style: 'margin-top:6px', text: 'Tap players below in finishing order (' + pendingPcts.join('/') + '). Odd dollars go to 1st.' }));
        }

        const ord = (n) => n + (['st', 'nd', 'rd'][n - 1] || 'th');
        for (const p of selPlayers()) {
          const placeIdx = placeOrder.indexOf(p.id);
          const ctl = moneyControl(payouts[p.id] || 0, (v) => { payouts[p.id] = v; updateTotals(); }, 'payin', p.id);
          modal.append(el('div', { class: 'check' + (placeIdx >= 0 ? ' sel' : ''), style: 'flex-wrap:wrap', onclick: (e) => {
            if (e.target.tagName === 'INPUT' || !pendingPcts || placeOrder.includes(p.id)) return;
            placeOrder.push(p.id);
            const shares = presetSplit(pot(), pendingPcts);
            payouts[p.id] = shares[placeOrder.length - 1];
            if (placeOrder.length === pendingPcts.length) { pendingPcts = null; presetLabel = null; }
            rebuild();
          } }, [
            placeIdx >= 0 ? el('span', { class: 'pos', style: 'font-weight:800;min-width:34px', text: ord(placeIdx + 1) }) : null,
            el('div', { class: 'grow title', text: p.name }),
            ctl.num,
            ctl.range,
          ]));
        }
        modal.append(el('div', { class: 'balanceline', style: 'margin-top:10px' }, [balanceLabel()]));
      }

      const toggle = el('label', { class: 'check', style: 'margin-top:16px' }, [
        el('div', { class: 'grow', text: 'Split the pot / edit amounts' }),
        (() => { const c = el('input', { type: 'checkbox' }); c.checked = manual; c.addEventListener('change', () => { manual = c.checked; if (manual) seedManual(); rebuild(); }); return c; })(),
      ]);
      modal.append(toggle);
    } else {
      modal.append(el('div', { class: 'muted', style: 'margin-top:12px', text: 'Select at least 2 players.' }));
    }

    if (editing) {
      modal.append(el('button', { class: 'btn ghost block', style: 'margin-top:18px;color:var(--neg)', text: 'Delete game',
        onclick: () => { if (confirm('Delete this game?')) { deleteGame(game.id); bg.remove(); } } }));
    }
  }

  function balanceLabel() {
    const d = totalPayout() - pot();
    return d === 0
      ? el('span', { class: 'balance-ok', text: '✓ Pot balanced' })
      : el('span', { class: 'balance-off', text: '⚠︎ Off by ' + money(Math.abs(d)) + (d > 0 ? ' over' : ' under') });
  }
  function updateTotals() {
    const potline = $('.potline', modal); if (potline) potline.textContent = 'Who played · pot ' + money(pot());
    const bl = $('.balanceline', modal); if (bl) { bl.innerHTML = ''; bl.append(balanceLabel()); }
    // Winner-screen net / "in for" labels (buy-in amounts are inputs and manage themselves)
    modal.querySelectorAll('[data-npid]').forEach((n) => {
      const pid = n.dataset.npid;
      if (winnerId) {
        const net = pid === winnerId ? pot() - contribOf(pid) : -contribOf(pid);
        n.className = net > 0 ? 'pos' : net < 0 ? 'neg' : 'zero';
        n.textContent = signed(net);
      } else {
        n.className = 'muted';
        n.textContent = 'in for ' + money(contribOf(pid));
      }
    });
  }

  function onSave() {
    if (!name.trim()) { toast('Pick or name the game'); return; }
    if (selected.size < 2) { toast('Pick at least 2 players'); return; }
    let lines;
    if (manual) {
      const tp = totalPayout();
      if (tp > 0 && tp !== pot()) { toast('Payouts must equal the pot, or clear them to save in progress'); return; }
      // tp === 0 => saved in progress; tp === pot => finalized split
      lines = selPlayers().map((p) => ({ player_id: p.id, contribution: contribOf(p.id), payout: payouts[p.id] || 0 }));
    } else {
      // Winner set => winner-takes-all; no winner => open game (no payouts yet)
      lines = selPlayers().map((p) => ({ player_id: p.id, contribution: contribOf(p.id), payout: (winnerId && p.id === winnerId) ? pot() : 0 }));
    }
    saveGame({ id: game ? game.id : null, name: name.trim(), buyin: stake, played_at: when.toISOString(), lines });
    bg.remove();
  }

  build();
}

function toLocalInput(d) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

// ---------- boot ----------
render();
loadCustomGames();
loadAll();
if (state.tripId) subscribeRealtime(state.tripId);
</script>
</body>
</html>
